summary: |
    `0052`'s generator writes `recordings/aircraft-sample.ndjson` at the
    repository root, and `--recording` already takes any output path
    (`.build/Build.cs`). The Mac Catalyst head can read only its own container
    (`0061`), so seeing the sample on screen today means copying the file there
    by hand and putting the container's absolute path in `appsettings.json` — the
    local edit that has to be re-applied on every branch and must never be
    committed.

    A build target derives the container's recordings root — the same one `0061`
    makes the head's default — and writes the sample there, so a developer runs
    one command and the head finds the file with nothing in configuration but
    the recording's name. Invoked deliberately, never as part of a build.

    Waits on `0061`, because the target writes to the root that item decides;
    writing to a path the head does not default to would be the same workaround
    with a target in front of it.

acceptance_criteria:
    - "One `nuke` target writes the sample recording into the root the head reads
      by default, with no path typed and none committed."
    - "The target takes the existing `--seed`, `--polls` and `--poll-interval`
      parameters, and writes through `0052`'s generator rather than a second
      writer of ADR-0004's format."
    - "`docs/runbook.md` names the command beside where a recording lives on the
      Mac (`0061`)."

decisions:
    - "2026-10-09 — the person — no recording ships inside the application, not
      even `0052`'s synthetic one as a MAUI raw asset. Raised by `the-architect`
      as a way to make replay work with no setup; rejected because this item
      gets the same result with nothing in history, and it would narrow `0052`'s
      2026-10-06 decision against a committed sample and `replay-source`
      `adr/0001`'s rejection of an embedded recording."

    - "2026-10-14 — implementer — one dependent branch on 0061 (PR #93),
      because verifying that the generated file is found without a root override
      requires that head's platform default. PR #93 merged during verification;
      rebased onto main, so this item opens against main with no stack."
    - "2026-10-14 — implementer — SampleRecordingForApp derives the Mac Catalyst
      container from the current user's home and Gui's ApplicationId. It reuses
      the existing generator and its seed, polls and poll-interval parameters;
      SampleRecording retains the explicit --recording destination. The app
      target requires macOS and rejects --recording rather than silently
      ignoring an explicit destination. Neither generator runs in Default."
    - "2026-10-14 — implementer — scenario exemption: build-machine setup only;
      replay-source B-001, B-002, B-006, B-024, B-025 and B-027 remain unchanged.
      Verify by executing both targets, comparing seeded output, and starting
      the sandboxed head with only the recording name configured. No product
      scenario or specification amendment is needed."

    - "2026-10-14 — implementer — verified ./build.sh (both Apple heads and
      318 tests), plus 20 focused generator/root/head-startup tests. Executed
      default generation (40 payloads/585 seconds), parameter forwarding
      (seed 79, 41 payloads, 10-second spacing/400 seconds), byte equivalence
      with SampleRecording's explicit destination, and rejection of
      --recording on the app target. Default did not rewrite the sample."
    - "2026-10-14 — implementer — launched the sandboxed Mac Catalyst head
      with only Replay:Aircraft=aircraft-sample.ndjson in a temporary secrets
      asset, no credentials and no root override. Startup reported that file
      under Data/Library/recordings with a 585-second span. Stopped the head;
      the generated sample remains available locally. Source selection is
      still 0039; availability does not select replay."

out_of_scope:
    - "Where the head's default root is — `0061`."
    - "Selecting the recording from the screen — `fleet-dashboard` `0039`."
    - "A recording bundled with the application — rejected, decisions above."

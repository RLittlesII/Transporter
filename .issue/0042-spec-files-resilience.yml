summary: |
  Test code (BoundaryAnalyzerDescriptorTests) references spec files via hardcoded
  relative paths, making tests brittle when specs are relocated. After moving
  aircraft-source/.spec to OpenSky, test paths broke and required manual updates.

  Refactor SpecificationTables to load specs from a conventional location or as
  part of test assets, so reorganizing spec folders doesn't break test discovery.

acceptance_criteria:
  - "Spec file paths in tests are determined dynamically (e.g., by convention or
    test asset location) rather than hardcoded strings."
  - "Relocating a spec folder does not require updating test code paths."
  - "All analyzer descriptor tests pass."


summary: |
  `src/Transporter/Transporter.csproj` references `Microsoft.Maui.Controls.Core`.
  It came in with the Akka demo (`4e33882`, 2026-10-03), and nothing in the
  assembly uses it: with the reference removed, the assembly builds and all
  219 tests pass. The person, 2026-10-08: the feature assembly has no
  dependency on MAUI. The model, the pipeline, the integrations and the view
  models are plain .NET; a page is the host's.

  An unused package reference is easy to miss, and a used one is a design
  defect, so the fix is the removal plus a gate: a test that fails when the
  compiled assembly references any `Microsoft.Maui` assembly. A package
  reference nothing uses is compiled away and the test cannot see it — that half
  is a rule written in `transporter-conventions`, checked by review.

acceptance_criteria:
  - "`src/Transporter/Transporter.csproj` references no MAUI package, and
    `Directory.Packages.props` carries no version nothing references."
  - "A test fails when the `Transporter` assembly references an assembly whose
    name starts with `Microsoft.Maui`."
  - "`transporter-conventions` references/coding.md § \"Project structure\" says
    `src/Transporter` references no MAUI package."
  - "./build.sh passes and every existing test passes."

decisions:
  - "2026-10-08 — the person — `src/Transporter` has no dependency on MAUI
    controls. Filed as a bug on its own branch, apart from ADR-0014, which named
    the reference as evidence and now names it as this defect."
  - "2026-10-08 — implementer — the test was not run red. Showing it fail needs
    the reference put back with a MAUI type used, and the person declined
    restoring the reference even for a trial. With the reference gone, a MAUI
    type in the assembly fails to compile (`CS0234`, checked with a probe and
    deleted), which is the stronger gate; the test catches the reference
    returning with a use."

out_of_scope:
  - "Moving any page out of `src/Gui` — `0075`."
  - "A `BoundaryAnalyzer` rule for package references. An analyzer reads
    syntax and symbols, not a project file; the test reads the compiled
    assembly instead."

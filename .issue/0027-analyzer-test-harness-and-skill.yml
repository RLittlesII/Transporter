summary: |
  Review of pull request #6 asked for Rocket.Surgery.Extensions.Testing.SourceGenerators
  instead of the hand-rolled harness in test/UnitTests/Analyzers/AnalyzerHarness.cs,
  and for a skill covering it. Airframe tests the RSA rules this repository
  already runs with that package, so the pattern was there to copy rather than
  invent.

  The harness is gone: GeneratorTestContextBuilder compiles the source, runs the
  analyzer and hands back the diagnostics, and BoundaryAnalyzerContext wraps the
  four lines the boundary tests share. Its two document helpers were not harness
  concerns at all — they read § 7's mapping table and aircraft-source § 9 — so
  they moved to SpecificationTables.

  Two findings came out of doing it. The package's own API is not what the
  source-generators skill documented: that skill's references/testing.md taught
  GeneratorTestContext.Create(), .WithSource(), result.VerifyAsync() and
  VerifySourceGenerators.Initialize(), none of which exist. It is rewritten
  against the package's XML documentation and a consuming repository. And
  AssertCompilationWasSuccessful() cannot be used on an analyzer whose rules
  default to error, because the expected diagnostic is what makes it fail.

acceptance_criteria:
  - "No hand-rolled compilation anywhere in the test project; the builder is the
    only harness."
  - "Every test that passed before passes after, under the same name — the names
    aircraft-source § 9 fixes are cites, not labels (boundary-analyzer B-016)."
  - "A repository skill holds what is specific here, and the agent-level skill it
    extends no longer documents an API that does not exist."
  - "The analyzer still loads and still fails a build: a seeded violation reports
    error TRN0001 at its line."

decisions:
  - "2026-10-04 — the person — assertions, not Verify snapshots. Verify arrives
    transitively with the package and stays unused: transponder-conventions fixes
    the stack at xUnit and AwesomeAssertions, and a snapshot nobody reviews is a
    test that passes because it was regenerated."
  - "2026-10-04 — implementer — Microsoft.CodeAnalysis.CSharp moves from 4.14.0 to
    5.0.0 repository-wide. The testing package requires 5.0.0 and central
    transitive pinning allows one version per id. Verified that the analyzer still
    loads: no CS8032, and a seeded violation still fails the build."

out_of_scope:
  - "The code fixes themselves. B-020 is the claim and TRN0009, TRN0011 and
    TRN0017 are the three that can have one; they land in 0023 and 0024 with the
    rules they fix, in src/Transporter.CodeFixes."
  - "Re-cutting 0020 - 0022, which lesson 0008 records as a decomposition defect
    and the reviewer explicitly left alone."

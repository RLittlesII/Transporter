summary: |
    The repository is published as `RLittlesII/Transporter`, and everything
    inside it is named Transponder: the solution, four project directories,
    every namespace, the conventions skill and the prose. The README already
    carries both, a Transponder title above a badge that points at
    Transporter. This item gives the inside the name the outside has.

    Nothing behaves differently afterwards. The change is a rename of files,
    directories, namespaces, assemblies and identifiers, with every reference
    to a moved path repointed in the commit that moves it.


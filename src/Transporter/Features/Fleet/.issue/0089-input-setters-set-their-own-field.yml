summary: |
  A behaviour-preserving refactor. `mvvm` now says a setter sets its own field
  and nothing else, and lesson 0005 names three `FleetViewModel` setters that
  predate the rule: `SearchText` and `SelectedFilter` call `Filter()`, and
  `SelectedGrouping` calls the tracker's `GroupBy`. Each becomes a plain
  `RaiseAndSetIfChanged` setter, and the constructor composes `WhenChanged`
  streams that hand the tracker `FleetSearch.Composed(...)` and the grouping,
  disposed with the view model. The description's arrival keeps re-filtering.

  No new scenario: the exemption cites B-009, B-011 and B-012, whose behaviour
  is preserved and whose existing tests must keep passing, advancing the
  scheduler where the streams now surface on it.

  The trap is the description's re-filter: folding it into the setters'
  stream drops it, and a swap then leaves the old predicate's columns in force.

acceptance_criteria:
  - "B-009 — one predicate from both inputs, no collection enumerated."
  - "B-011 — clearing the choice leaves the search text."
  - "B-012 — a chosen grouping reaches `GroupBy`; absent keeps the seed."
  - "No setter of `SearchText`, `SelectedFilter` or `SelectedGrouping` does more than set its field."
  - "§ 9 carries a row naming a test for each id above."

decisions: []

out_of_scope:
  - "Everything in § 5 of the specification."
  - "Any setter outside `FleetViewModel` — lesson 0005 names only these three."

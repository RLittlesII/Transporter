summary: |
  On the Mac Catalyst head the Filter and Group by pickers list the
  description's choices, and choosing one changes nothing: `FleetPage.Controls`
  binds each picker's `ItemsSource` and never its selection, so
  `SelectedFilter` and `SelectedGrouping` are never set from the screen. No
  control calls `ChooseColumn` either — the header tap it was written for left
  with the grid in `0070`. The view model's half of B-009, B-011 and B-012 is
  tested and correct; the page's half was never wired, and B-001's review
  counted the pickers without choosing from them.

  `SelectedFilter` and `SelectedGrouping` become plain references, because a
  picker binds a plain value (`language-ext-usage` § "Where it stops"), and a
  `SortColumn` binding target, a `ReverseCommand` and a `ClearFilterCommand`
  give the sort and the clear a surface. Lesson 0006 holds the incident.

acceptance_criteria:
  - "B-001 — the filter, grouping and sort choosers are on the page and each choice moves the fleet."
  - "B-009 — the filter picker's choice reaches the one predicate."
  - "B-011 — clearing the filter leaves the search."
  - "B-012 — the sort picker hands the comparer, reverse hands its reverse, the grouping picker hands the grouping."
  - "§ 9 carries a row naming a test for each id above."

decisions: []

out_of_scope:
  - "Everything in § 5 of the specification."
  - "Rendering the fleet in groups — the grouping still reaches `GroupBy`, and the summary counts groups; drawing them is its own item."
  - "Making altitude and ground speed sortable — the description's columns are `fleet-pipeline`'s."

summary: |
  The demo-readiness review of 2026-10-15 ran the Mac Catalyst head on the
  30-minute aircraft recording and found three defects on the fleet cards.
  A vertical rate reads "+1,919 ft" or "−705 ft/m": the cell is cut to its
  column, and a cut "ft/min" reads as an altitude. A stale card is taller
  than its neighbours, because its "Vertical rate" caption wraps. And at
  startup MAUI logs "is already a child of" for every card's readouts,
  labels, badge and edge.

acceptance_criteria:
  - "No \"already a child\" warning at startup on the Mac Catalyst head."
  - "Every readout's value shows whole, the four-digit signed vertical rate included."
  - "A stale card and a fresh card in one row are the same height."
  - "B-006 — a card still lays its views out only when the roles change, and fills them on a poll."
  - "B-008 and B-029 — the stale mark and the description's roles are unchanged."


summary: |
  Cut on 2026-10-15 from decisions/0004. `0072`'s rendered review saw the
  countdown start one to two seconds above a fifteen-second interval and still
  read about a second when the next poll landed, because it was measured from
  the observed instant — the provider's clock — to a due instant on the
  poller's. B-036 now measures it from the instant the poll was made, which the
  poll status carries (`fleet-pipeline` B-040, `aircraft-source` B-054).

  Waits on `0072`, which built the countdown, and on `aircraft-source` `0094`,
  which puts the poll's instant on the status. Does not move to `in-progress`
  until this specification's §§ 1-5 row is 🟢 again.

  Two traps. Reading a clock in the view to correct for the request's latency
  is § 5 row 10's exclusion. And the observed instant must leave the
  countdown entirely — keeping it as a fallback re-introduces the skew.

acceptance_criteria:
  - "B-036 — the countdown's length measured from the poll's own instant, never the observed one."
  - "§ 9 Traceability Matrix carries a row naming a test and a re-done rendered review for B-036."

decisions:
  - "2026-10-17 — implementation: one dependent branch over PR 122, because this countdown consumes the PolledAt member supplied by 0094 and cannot compile against main yet. Retarget to main when that base merges; specification sign-off is complete, with no gate waiver."

out_of_scope:

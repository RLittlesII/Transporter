summary: |
  The vessel is one level below `TransportVehicle`, built only by the
  strategy, labelled by its trimmed ship name or its MMSI, with speed in knots
  and course and heading in degrees as reported. Its description names its
  columns, comparers, filter choices, detail lines and two groupings, ship
  type and flag state, every one a selector over `TransportVehicle`.

  Flag state is read from the MMSI's MID through the full ITU allocation
  table, compiled in (§ 11 row 5, answered 2026-10-16). An MID the table does
  not hold groups as `Unknown`, as does ship type before static data.


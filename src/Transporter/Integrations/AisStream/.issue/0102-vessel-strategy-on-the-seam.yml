summary: |
  The closing act's one tap. The vessel strategy is registered like every
  strategy, behind the swap decorator under the name `Vessels`, with no
  contract layer and no member added to the seam, and with no poll status.
  Swapping either way changes the live description and the vehicles, and
  rebuilds nothing downstream.


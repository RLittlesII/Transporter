summary: |
  Vessels go, aircraft stay. A vessel silent for longer than its own
  threshold, 10 minutes by default (§ 11 row 3, answered 2026-10-16), is
  removed from the fleet and every collection bound from it, measured against
  the observed clock as it advances. An aircraft is still never removed.

  The removal is a stage of the tracker's pipeline, driven by the silence
  treatment and threshold the live source's description names, so it swaps
  with the description and the vessel strategy stays a plain changeset source
  (`fleet-pipeline` § 11 row 9, answered (A) 2026-10-16). That stage is
  `fleet-pipeline`'s to claim, and it does as B-044 (2026-10-16). This item
  builds that stage too, and completes `fleet-pipeline` § 9's B-044 row.

  Depends on `0099`: with no reported instant the clock never advances for
  vessels, and B-022 never fires.

  This item completes B-027's silence treatment after 0100 supplies the
  rest of the vessel description.

acceptance_criteria:
  - "B-027 — the vessel description names removal after its silence threshold."
  - "B-021, B-022 — removed past the threshold with no message arriving and no wall clock; back as a new arrival."
  - "B-023 — a configurable vessel threshold, distinct from the aircraft's, applied to vessels only."
  - "§ 9 carries a row naming a test or a performed review for each id above."

decisions:

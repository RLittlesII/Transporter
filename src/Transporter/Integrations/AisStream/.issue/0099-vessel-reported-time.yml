summary: |
  A vessel's time is what the feed reports, never a clock the client reads
  (ADR-0007). Which field carries that instant is § 11 row 6: the
  documentation shows none, and `PositionReport.Timestamp` is a UTC second.

  **`blocked` on § 11 row 6**, answered by reading a captured message. If
  the feed carries no full instant, B-015 leaves the clock alone, B-022 never
  fires, and ADR-0007 needs the person's amendment before this item can be
  built as claimed.

acceptance_criteria:
  - "B-014 — last contact is the reported instant, read from no clock."
  - "B-015 — each reported instant advances the observed clock; a message with none leaves it."
  - "§ 9 carries a row naming a test or a performed review for each id above."


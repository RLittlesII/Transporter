summary: |
  The closing act's source. AISStream's push feed of vessel positions over the
  Houston box is held in a cache the client writes one message at a time,
  projected into vessels by a strategy of its own, and selected with the swap
  control the presenter already has. A silent vessel is removed.

  Cut 2026-10-16 into six children, one per group of § 3, the same way
  `0001` was cut. The children hold the work; this item holds the claims
  until each child's are done.

  The person approved the four remaining R3 product choices on 2026-10-17,
  and an independent review approved every § 12 owner row. The children hold
  delivery; no implementation claim is complete merely because the agreement
  is approved. `0099` remains `blocked` on § 11 row 6's captured-message
  evidence. `0101` and `0102` also require the cross-feature specification
  reviews listed in vessel-source § 12.

acceptance_criteria:

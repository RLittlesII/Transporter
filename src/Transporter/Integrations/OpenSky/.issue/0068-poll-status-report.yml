summary: |
  The OpenSky poller writes ADR-0013's seam. After every poll it performs,
  cadence or demanded, it reports the instant the next is due (B-054), from
  the interval (B-050) or a `429`'s deferral and when the poll was made, on the
  scheduler it already runs on. When OpenSky answers `429` it reports the
  refusal and the interval `X-Rate-Limit-Retry-After-Seconds` gave (B-055).

  The client holds that due instant, and the loop sleeps until it. Through
  `IDemandedPoll` the actor reads it and refuses a demand until it, so a
  demand inside a `429` deferral spends no credit (B-053's deferral clause,
  amended 2026-10-15).

  The swap decorator selects the status with the live strategy (B-056), so a
  swap replaces it and a strategy with no poller contributes none.

  Waits on `fleet-pipeline` `0067`, which builds the seam and the tracker's
  re-publication of it.

  Two traps. The due instant is computed on the poller's scheduler, never from
  `DateTimeOffset.UtcNow`, or a test on a virtual scheduler passes and the demo
  shows a countdown that is wrong by the drift between the two. And a refusal
  is data, not a fault (`flurl-http-client`): the stream does not error, the
  cadence does not stop, and the next successful poll clears the refusal.

acceptance_criteria:
  - "B-053, its deferral clause — a demand inside a `429` deferral is refused until the deferred instant, read from the due instant the client holds."
  - "B-054 — the next-due instant reported each time a poll is scheduled; a performed demand moves it."
  - "B-055 — a 429 reported with its retry-after, and cleared by the next poll that lands."
  - "B-056 — the status selected with the live strategy: replaced on a swap, none for a strategy with no poller, nothing from the outgoing one after the swap."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."

decisions:
  - "2026-10-15 — the person: a demand inside a `429` deferral is refused (B-053 amended), rather than ending the deferral early. B-053's deferral clause joins this item, which builds the held due instant it reads."


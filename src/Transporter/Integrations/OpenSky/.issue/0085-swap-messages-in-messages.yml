summary: |
    `0080` declared `GetSwapTargets`, `SwapTargets`, `SwapTarget` and
    `SwapSource` in `Transporter.Tracking.Sources`, beside the actor that
    receives them. `fleet-dashboard` § 7 has `FleetViewModel` ask the first,
    read the next two and tell the last, and `BoundaryAnalyzer` reports
    `TRN0006` when a view model names a concrete class in `Transporter.Tracking`
    that `IFleetTracker` does not publish. So `0039`, built as designed, is
    reported by the analyzer B-041 and `fleet-dashboard` B-020 rely on. Found
    by `fleet-dashboard`'s § 12 re-read of 2026-10-09, finding 12.

    The remedy is already a rule: a message a consumer tells an actor lives in
    `src/Transporter/Messages/`, as `DemandPoll` does (`transporter-conventions`
    references/coding.md § "Project structure"). This item moves the four types
    there and changes nothing they do.

    The move's own review found it one type short. The actor was registered
    under `SourceSwapActor`, so a view model resolving it still named a class
    under `Tracking`. The same rule says the message doubles as the registry
    key, and the item registers the actor under `SwapSource`.

    No claim is delivered and none changes. B-057, B-041 and `fleet-dashboard`
    B-020 and B-040 stand as written, and B-057's three tests pass before and
    after. That is the no-scenario exemption, and those are the claims it
    preserves.

acceptance_criteria:
    - "`GetSwapTargets`, `SwapTargets`, `SwapTarget` and `SwapSource` are
      declared in `Transporter.Messages`, and a test fails if one is declared
      anywhere else."
    - "B-057's three tests in `SourceSwapActorTests` pass unchanged but for a
      `using`."
    - "The swap actor is registered under `SwapSource`, and a test fails if it
      is resolved by any other key."
    - "§ 7's type table names the four files under `Messages/`, and
      `fleet-dashboard` § 7 says where the view model reads them."

decisions:
    - "2026-10-09 — `implementer`, on the `spec-reviewer`'s first finding — the
      scope widens from the four declarations to the registry key. A view
      model that can name the messages and not reach the actor is the defect
      this item was cut for, unfixed. `SwapSource` is the key rather than
      `GetSwapTargets`, because the swap is what the actor is for."
    - "2026-10-09 — closed on the independent re-read's 🟢 for § 12's §§ 6-7.
      Its one finding against the item was this file's own text, answered
      above; that answer was not itself re-read."

out_of_scope:
    - "The picker, `FleetViewModel.Targets` and `SwapCommand` —
      `fleet-dashboard` `0039`."
    - "Any change to what the actor answers or to the handle a target carries
      — B-057."
    - "Widening `TRN0006` to admit a message under `Tracking` — rejected while
      building `0058`, and recorded on `DemandPoll`."

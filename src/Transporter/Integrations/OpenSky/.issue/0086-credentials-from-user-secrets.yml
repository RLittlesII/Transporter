summary: |
    Observed 2026-10-09, the day the person registered the OpenSky account and
    created the API client: there is nowhere to put the credentials. § 4 row 12
    says they come from user secrets or environment variables, and the head
    reads neither. `MauiProgram.Settings()` builds its configuration from the
    packaged `appsettings.json` alone, which `0047` decided carries no
    credential, and `0047` put "where a developer keeps them" out of scope. No
    item picked it up, so the live source can only ever answer `401`.

    The binding is already there: `OpenSkyCredentials` reads `OpenSky:ClientId`
    and `OpenSky:ClientSecret` from whatever configuration `AddTransporter` is
    handed. What is missing is the layer that carries them into it.

    A sandboxed Mac Catalyst or iOS head cannot open the home directory at run
    time, which is where the user-secrets store lives. So the store's file is
    packaged into the bundle at build time and layered over the packaged
    settings, and the layering is composed outside the head, where a test can
    reach it (`0047`'s first decision).

acceptance_criteria:
    - "B-058 — the store layered over the packaged settings; unchanged with no
      store."
    - "No credential, and no file that could hold one, is added to the
      repository."
    - "§ 9 carries a row naming a test for B-058, and the review of the half
      only a build performs."

decisions:
    - "2026-10-09 — the person — the credentials live in `dotnet user-secrets`
      under the id `transporter-gui`. The store is outside the repository
      tree, so every worktree builds with it and none holds a copy, and § 4
      row 12 stands as written. Rejected: a git-ignored
      `appsettings.Development.json` beside the packaged settings, which is
      the smaller change — it is already ignored and already globbed into the
      package — but needs a copy per worktree, puts the secret in the working
      tree, and rewords row 12. Rejected: environment variables, which a head
      launched from Finder or a simulator never sees at run time, so they
      would have to be written into an asset at build time anyway, and
      `0047` already rejected environment-over-asset once."

out_of_scope:
    - "Registering the account and creating the API client — § 5 row 15."
    - "Whether a missing credential stops the head at startup — B-029, whose
      test builds a host the head does not; a finding against it is reported,
      not fixed here."
    - "A settings screen, a keychain, or a run-time read of the home
      directory."

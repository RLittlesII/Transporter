summary: |
  Three values derived from movement, each riding on the element the fleet
  stream already publishes, so nothing downstream keeps a copy of a previous
  vehicle to work them out. The changeset that makes an update already carries
  the vehicle it replaced; B-041 puts it on the element for one update, B-032
  measures the great-circle leg between the two positions, and B-033 adds legs
  into a total that starts again when the vehicle leaves and comes back.

  It exists for `fleet-dashboard` decision 0002: a card that shows how far an
  aircraft moved, and a readout that shows what changed (`fleet-dashboard`
  B-030 and B-038). Both would otherwise be arithmetic in a view model, which
  `fleet-dashboard` B-018 forbids.

  Depends on nothing open: the spine, the description and the staleness stage
  are on `main`. Three items wait on this one: `0063` builds its trail from the
  same legs, `0064`'s delta reads the vehicle B-041 carries, and
  `fleet-dashboard` `0070` binds the distances.

  Two traps. A missing position on either side is no leg, not a zero, and a
  zero summed into the total reads as an aircraft that stood still. And the
  replaced vehicle is held for exactly one update: keeping two is a history,
  which § 5 row 12 excludes, and which grows without bound on a long talk.

acceptance_criteria:
  - "B-032 — the leg between the replaced and current positions, none where either lacks one."
  - "B-033 — the running total since the vehicle entered, reset on re-entry."
  - "B-041 — the vehicle one update back, none for a vehicle just added."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."


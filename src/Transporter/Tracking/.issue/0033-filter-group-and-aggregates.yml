summary: |
  The stages the audience watches: a predicate arriving re-filters what is
  already bound without refetching anything, a grouping key reforms the groups
  without rebuilding the pipeline, and the counts per group and for the fleet
  derive from the same stream as the collection.

  The predicate and the grouping key arrive as observables. Turning search text
  and a dropdown selection into either is the dashboard's (§ 5 row 4), and the
  easiest mistake in this item is building that here.

  The arrival notice (B-025 – B-027) is here because it is the same derivation
  as the summary: the instant and the counts the tracker already holds. The rate
  cap is per consumer rather than per tracker, so the notices are a stream a
  caller paces — one operator, written and tested once, two cadences on screen
  (§ 4 row 10).

  Runs after `0032`, whose description supplies the groupings this item
  applies, and after `0034`: B-014's stale count has nothing to count until a
  vehicle can be marked.

acceptance_criteria:
  - "B-006 — a new predicate re-evaluates existing items and re-subscribes
    nothing."
  - "B-007 — before any predicate arrives, every vehicle is visible. An absent
    filter is not an empty fleet."
  - "B-008 — no filter applied by enumerating the collection or from an event
    handler. Analyzer rule."
  - "B-012 — changing the grouping reforms the groups and rebuilds nothing."
  - "B-014 — each group reports its tracked and stale counts, derived rather
    than enumerated."
  - "B-015 — the fleet summary derives from the same stream and changes with
    it."
  - "B-025 — one notice per changeset that changed something, carrying the
    observed instant and the counts; an empty changeset raises none."
  - "B-026 — the notices are paced by the caller, so two consumers run at two
    cadences and either can change while running."
  - "B-027 — a quiet notice once when no changeset arrives within the
    threshold, and a resumed notice on the next one."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."

decisions:
  - "2026-10-06 — implementer — closed on all nine of its claims, and the
    specification's § 9 now reads twenty-eight `Verified` of twenty-eight.
    Eight moved by test: B-006 and B-007 against `FleetFilterTests`, B-012 and
    B-014 against `FleetGroupTests`, B-015 against `FleetSummaryTests`, and
    B-025 – B-027 against `FleetNoticeTests`. B-008 moved by a performed
    review, and the row says what was looked at."
  - "2026-10-06 — implementer — B-008's diagnostic is filed as
    `boundary-analyzer` `0054` rather than built here, and its § 9 row carries a
    performed review in the meantime: nothing under `Features/` or `src/Gui`
    calls `Filter`, `SortBy` or `GroupBy`, and `src/Gui` declares no event
    handler. Same call `0032` made for B-022 and `0031` for B-023 — a rule this
    repository's analyzer does not carry is that Feature's claim to make. What
    is specific here is that the obvious rule would report the shape § 7 chose:
    a view-model property setter handing the tracker a predicate is supported,
    so separating that from re-deriving a filter inside a handler is a design
    question. `0054` is `ready-for-architecture` for that reason, and the review
    holds only until the first view model wires a search box — `0037`."
  - "2026-10-06 — implementer — the groups re-form through the operator's own
    regrouper, not by switching group stages. The key selector reads the
    grouping subject on every evaluation and `GroupBy` pushes a value.
    Rejected: a stage per grouping with `Switch` between them, which drops the
    shared chain's reference count to zero at the switch and reconnects the
    seam — B-012's \"rebuilds nothing\" failing in exactly the way B-028 is
    about, and invisibly, since the groups would still be correct."
  - "2026-10-06 — implementer — the default grouping is the vehicle's own
    `GroupKey`, held by the tracker beside the default predicate and the default
    threshold rather than taken from the description. A grouping that arrived
    only with a description would leave the group stream empty until one did,
    and an empty group stream is indistinguishable from a fleet with no groups —
    the same shape as B-007's reason for holding the predicate's default here."
  - "2026-10-06 — implementer — the summary is derived from the groups rather
    than from the fleet and the groups together: the tracked count sums the
    groups' counts, the stale count sums theirs, and the group count is the
    stream's own. Combining two streams published twice per change, the first
    time with half the counts a change behind, which is a summary a view can
    render inconsistent. The cost is that a consumer subscribing before the
    first changeset receives nothing until one arrives, which the second
    summary test states rather than hides."
  - "2026-10-06 — implementer — the notices are counted from the stage above
    the stale mark. That stage carries what the seam reported, and the mark's
    re-derivation is not an arrival: counting it would announce the passage of
    time as new data and would make a quiet spell undetectable, because the
    clock tick that detects silence would itself produce the changeset
    disproving it. § 7 records it, and § 8 carries the one finding for
    `spec-author` — whether B-025's wording should say \"a changeset the seam
    reported\"; the claim is unamended here."
  - "2026-10-06 — implementer — the rate cap switches its sampler and never its
    source, so an interval changed while running takes effect over the same
    subscription and the same state. Switching the source instead would tear
    down the quiet spell's state every time a consumer changed cadence, which
    B-026's last clause forbids. The notices therefore arrive up to one interval
    late, which is what \"the most recent notice in a capped window\" buys and
    what every notice test advances the scheduler to reach."
  - "2026-10-06 — implementer — the constructor gained `ISchedulerProvider`,
    which § 7 always declared and the spine had no use for. The rate cap is the
    first operator in this pipeline to need a scheduler at all, so B-005's
    review was re-done on this item and its § 9 row records it: the cap times
    its windows on the provider's background thread, and the fleet, groups and
    summary stages still deliver synchronously."


summary: |
  `IFleetTracker` wraps `ITrackerSource` and is the only thing view models
  depend on. It owns the collection pipeline and the injected clock: staleness
  derives from a vehicle's last contact against that clock, and no component
  below it reads one — which is what makes the contract, the client, the cache
  and the strategies testable with no scheduler at all.

  A stale aircraft is marked and kept, never removed (B-051). A row vanishing
  mid-sentence reads as a bug; a row flagged stale reads as information.

  **Ownership is claimed here; the operators are not built here** — § 5 row 1
  draws that line, and it is the easiest line in this feature to cross by
  accident.

  It is also the first point at which there is a whole chain to resolve, which
  is why B-052 lands here rather than on the item that wrote the first
  registration.

  Runs after 0005, which declares the interface it wraps.

acceptance_criteria:
  - "B-041 — what view models may depend on."
  - "B-042 — pipeline ownership, built once. Ownership only; building the
    operators is the next feature (§ 5 row 1)."
  - "B-043 — the injected clock, and no inline `DateTime.UtcNow`."
  - "B-044 — no imperative change to a bound collection."
  - "B-047 — what nothing downstream may reference. Falsifiable once the
    wrapper exists to be downstream of."
  - "B-051 — stale is marked and kept, never removed."
  - "B-052 — the constructed container resolves the tracker with every
    dependency satisfied and the decorator in place."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."

decisions:
  - "2026-10-06 — the person — B-042's `and binding` clause moves to
    `fleet-dashboard` B-005 rather than being deleted. ADR-0009 gave the bind
    and the marshal to the consumer, and the dashboard's claim already requires
    the one collection to be materialised from this stream on the injected
    user-interface scheduler and disposed with the view model — so the
    obligation is held and simply unprovable until that view model exists, where
    its § 9 row stands `Missing`. § 3's B-042 drops the clause and names where it
    went, § 5 row 1 drops binding from the operator list, new § 5 row 18
    excludes the bind and the marshal by name, and the `@B-042` scenario asserts
    that no binding is among what survives a swap. Rejected: deleting the clause,
    which would have left the one obligation nothing in this Feature could
    satisfy looking like an obligation nobody holds."
  - "2026-10-06 — the person — the published element is `TrackedVehicle`, not
    `StaleVehicle`: almost no instance of it is stale, so the old name described
    the minority (review of pull request 25, lesson 0012). Renamed in the code,
    in this Feature's § 7 and in `fleet-pipeline` and `fleet-dashboard` § 7; the
    old name stays in § 11 row 4's record of the review that chose the wrapper
    and in `0030`'s decision rows, which are records of what was decided that
    day. No claim, scenario or § 9 row named the type."
  - "2026-10-06 — the person — the tracker stays under `Tracking/` rather than
    moving to `Features/Tracking/` (same review). Two Features and the replay
    source consume that layer, so filing it under one Feature makes the other
    two reach into a sibling's folder — the reason integrations are not under
    `Features/` either. `transponder-conventions` § `coding` already held the
    rule for the model and the strategies and now covers the tracker, the clock
    and the published element too."
  - "2026-10-05 — implementer — this item is delivered in two pull requests and
    the second one closes it. The production code landed first because the
    documented order — test before implementation — could not run: a test must
    name `IFleetTracker` and the type did not exist. So this pull request leaves
    the item at `in-review` with its seven § 9 rows `Missing`, and
    `test-writer`'s pull request writes `FleetTrackerTests`,
    `TransponderContainerTests` and the rows, then flips `done` and `closed`.
    B-052's decorator half additionally waits on `0006`."
  - "2026-10-05 — implementer — the tracker is registered by its own call,
    `TrackingRegistration.AddFleetTracking()`, as a container singleton
    (ADR-0009 decision 7), and `AddOpenSky` gained one line registering the
    aircraft strategy as `ITrackerSource` itself. The tracker belongs to no
    provider, so putting it in `AddOpenSky` would make a second provider's
    registration carry it; and the seam registration is the inner one
    `0006`'s decorator wraps, which ADR-0003 already decided. Rejected: the
    tracking layer naming the aircraft strategy, which would couple the
    provider-agnostic registration to one strategy."
  - "2026-10-05 — implementer — B-042's clause naming `binding` is stale after
    ADR-0009 moved `Bind` to the consumer, and the amendment is `spec-author`'s.
    Raised in § 7 rather than taken: the rest of the claim holds, and an
    implementation pull request editing § 3 to match its code is the failure
    the role split exists to prevent."
  - "2026-10-05 — implementer — the stale mark is re-derived when a changeset
    arrives and when the threshold changes, and not when the clock advances on
    its own. A vehicle that goes silent while nothing else moves therefore stays
    unmarked until the next changeset. That re-evaluation is `fleet-pipeline`
    B-018 over `IObservedClockTicks` (ADR-0010); B-051 is about what happens to a
    stale vehicle, not about what notices one."
  - "2026-10-04 — the person — B-052 is added to § 3 and assigned here: the
    container the application constructs resolves `IFleetTracker` with every
    dependency satisfied and every decorator applied. It lands on this item
    under the same rule as B-047 — the child that makes the claim falsifiable
    — because no earlier item has a whole chain to resolve. Rejected: a
    per-registration claim on `0002`, which would read `Verified` from the
    first registration onward while later ones arrived uncovered. `risk` and
    `rank` are unchanged: the claim names a hazard ADR-0003 already recorded
    against `0006` rather than a new one, and this item's own two hazards
    stand."
  - "2026-10-04 — the person — the observed instant reaches this item's clock
    through one object written by the integration and read here, recorded in
    ADR-0007. Rejected: a second member on `ITrackerSource`, which widens the
    seam B-037 protects, and the instant on each projected vehicle, which goes
    stale on the vehicles that stopped reporting. Releases this item from
    `ready-for-architecture`; `risk` 4 → 3 in § Scoring."


summary: |
  A decorator registered as `ITrackerSource` picks which strategy is live at
  runtime. There is no `IStrategyResolver` and no caller that asks which
  strategy to use: every strategy registers as the same interface, and the
  decoration performs the swap. Nothing downstream can observe from the stream
  that a swap happened — which is the claim the closing act makes on stage, so
  it has to be true in the source rather than in the narration.

  Adds `Scrutor` to `Directory.Packages.props` — the first item that builds the
  decorator does, per § 4 row 17 and ADR-0003. `Decorate<>` is
  registration-order sensitive and fails silently, which is most of this item's
  risk.

  Runs after 0005, which declares the interface it decorates and provides the
  one strategy it can wrap. Replay selection (0012) waits on this item, since
  replay is selected by this decorator and by nothing else.

acceptance_criteria:
  - "B-038 — the decorator registered as the seam, and no resolver type."
  - "B-039 — a swap unobservable from the stream."
  - "B-040 — the outgoing source is stopped, so it stops spending credits."
  - "B-052 — the constructed container resolves `IFleetTracker` with every
    dependency satisfied and this decorator applied. Taken from `0007`, which
    could not prove it before the decorator existed."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."

decisions:
  - "2026-10-06 — the person — B-052 moves here from `0007`. Its second clause
    is \"every decorator applied\", so the claim is unprovable until this item
    builds one; `0007` held a row nothing it delivered could move."
  - "2026-10-04 — spec-author — Scrutor rather than keyed services, per-type
    interfaces, or hand-written decoration. Recorded with its rejected options
    in ADR-0003."

out_of_scope:
  - "The swap control, the stage choreography, and cancelling an in-flight
    result on swap (§ 5 row 5). `hot-swap-source` owns them; this item claims
    the decorator's obligations and stops there — no selector UI, no disposal
    choreography."
  - "A second strategy to swap to. The replay and simulated strategies are
    § 5 row 4 and the vessel feed is § 5 row 3."
  - "Rebuilding anything on swap. B-042 forbids it and belongs to 0007."

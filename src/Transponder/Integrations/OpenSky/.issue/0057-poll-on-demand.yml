summary: |
  The half of the refresh gesture that performs the work. An actor is told a
  poll is wanted and decides whether to make one: inside B-050's configured
  interval it refuses, outside it polls once, and the snapshot reaches the cache
  by the path every other poll already takes. The gesture that tells it is
  `fleet-dashboard` B-028, built by `0058`.

  Throttled rather than free because one poll is one credit against 4,000 a day,
  and an unbounded control over that budget is what `fleet-pipeline`
  decision 0002 already refused — see decision 0003, which is the spec delta
  that record left available. Binding the window to B-050 rather than adding an
  option is what keeps the guarantee statable: demand cannot make the source
  spend faster than its own cadence.

  Depends on nothing: the client, the cache, the options and the dependency
  resolver are all on `main`, and the actor this adds is registered the way
  `SourceSwapActor` already is.

  Two traps. A refusal is silent to the caller and must not fault the stream or
  disturb the cadence — a throttle implemented as an exception would surface as
  a broken grid. And the refusal window is measured from the last poll the
  source actually made, cadence polls included, not from the last demanded one;
  measuring only demand lets a press land one tick after a scheduled poll and
  spend a credit for a snapshot the cadence was about to fetch anyway.


summary: |
  A vehicle silent past the threshold is marked and stays in the collection; a
  row vanishing mid-sentence reads as a bug, a row flagged stale reads as
  information. The threshold is configurable and defaults to five minutes.

  The mark is **derived, never stored** on the vehicle — `domain-model`
  § "Never add" forbids a stored flag, and the clock moves — so it is carried
  beside the vehicle in the element the pipeline publishes (`TrackedVehicle`),
  which a consumer binds — the pipeline exposes no collection of its own
  (ADR-0009).

  This item adds a seam rather than widening one. `IObservedClock` exposes
  `Current` and no observable (§ 4 row 3), so nothing can notice the instant
  advancing and B-018's second clause cannot be satisfied by reading it.
  ADR-0010 answers it with a third read-side interface,
  `IObservedClockTicks`, carrying `Instant`: the two interfaces
  `aircraft-source` published are untouched and ADR-0007 stands unamended. The
  risk this item carried for editing another Feature's interface is lower for
  it — a new interface breaks no implementer — while the two silent-wrong-answer
  hazards below are unchanged.

  Runs after `0031`, and before `0033`, whose per-group stale count has nothing
  to count until a vehicle can be marked.

acceptance_criteria:
  - "B-016 — marked stale and still present, still keyed."
  - "B-017 — configurable, defaulting to five minutes."
  - "B-018 — measured against the observed clock through `IObservedClockTicks`,
    re-evaluated when the observed
    instant advances, and never from an inline `UtcNow`. Two hazards: an inline
    read passes every test written against a controlled clock and is wrong only
    under replay; staleness evaluated once on arrival leaves a silent fleet
    permanently fresh, which looks like a working demo."
  - "B-019 — nothing is removed for going silent, and no expiry stage exists."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."

decisions:
  - "2026-10-06 — implementer — `ObservedClock` implements `IObservedClockTicks`
    alongside the two interfaces it already had (ADR-0010), and the tracker takes
    the third seam by constructor. `IObservedClock` and `IObservedClockWriter` are
    untouched, so ADR-0007's read/write split stands unamended: a consumer holding
    the ticks still cannot advance time. The instant is a `BehaviorSubject` seeded
    at `DateTimeOffset.MinValue`, so a stage subscribing after startup reads the
    instant in force rather than waiting for the next envelope. Rejected: a
    pipeline that ticks itself on a scheduler, which ages a paused replay (ADR-0010)."
  - "2026-10-06 — implementer — the `Transform` force trigger is the threshold
    merged with every advance of the instant, which is the whole of B-018: a mark
    is re-derived rather than a vehicle removed and re-added, which is also why
    B-019 forbids `ExpireAfter`."
  - "2026-10-06 — test-writer — B-019 carries a review beside its test. \"No
    `ExpireAfter` anywhere\" is an absence no test reads; `grep` over `src/`
    returns only the remark in `FleetTracker` saying why there is none. The
    analyzer rule § 9 first named needs the layer map widened, which is
    `boundary-analyzer`'s claim to make — the same answer B-022 and B-023 got."


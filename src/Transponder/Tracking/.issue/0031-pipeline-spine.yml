summary: |
  Assemble the pipeline in `FleetTracker`'s constructor, publish the fleet as a
  stream of changesets, share the stages, and dispose every subscription with
  the tracker. Filtering and sorting are wired here as stages reading the
  subjects the four input methods tick (§ 4 row 14); what the comparers and
  grouping keys are is `0032`'s.

  ADR-0009 moved the item's shape on 2026-10-05: no `ReadOnlyObservableCollection`
  is exposed, `IFleetQuery` is not declared, and the `Bind` plus the marshal to
  the user-interface scheduler belong to `fleet-dashboard`'s view models. A test
  here binds a collection itself to observe the stream.

  The four inputs are **methods** — `Filter`, `SortBy`, `GroupBy`, `StaleAfter`
  — each ticking a `BehaviorSubject<T>` this item creates and seeds with the
  claimed default, so B-007's "everything visible" and B-017's five minutes are
  kept here rather than by every caller's `StartWith`.

  Both boundary claims land here because a boundary cannot be asserted before
  one side of it exists, and this item is the first code downstream of the seam.

  Runs after `aircraft-source` `0007`, which declares `IFleetTracker` and gives
  it the clock. The members this Feature adds to that interface are § 7's.

acceptance_criteria:
  - "B-001 — built once, and a swap rebuilds nothing."
  - "B-002 — changeset streams, no bound collection on the tracker; one
    collection materialised by the consumer, its element carrying the stale
    mark."
  - "B-003 — no imperative add, remove, clear or reorder. Analyzer rule."
  - "B-004 — every subscription disposed with the tracker, and a swap leaks
    nothing. The hazard is a pipeline that works and leaks."
  - "B-005 — every scheduler is injected, none ambient, and the pipeline
    marshals to no user-interface thread for a consumer."
  - "B-023 — nothing here names a contract, client, cache, snapshot or a
    concrete `ITrackerSource`. Analyzer rule."
  - "B-024 — no network, file or wall clock in this Feature's tests.
    Unenforced by analyzer (§ 8); the arrangement is the evidence."
  - "B-028 — one connection to the seam however many subscribers, and the
    stages stop when the last one unsubscribes."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."

decisions:
  - "2026-10-05 — the person — the pipeline publishes changesets and a consumer
    binds them (ADR-0009). Asked which way to split `IFleetTracker`'s mixed
    members, the person pivoted instead: a domain object owning a
    `ReadOnlyObservableCollection` has decided its consumer has a UI. Also
    settled here: the stages are shared by DynamicData's cache-aware
    `RefCount()` — not Rx's `Publish().RefCount()` pair (B-028) — the
    four inputs are constructor parameters rather than an `IFleetQuery` the view
    model implements, and the tracker is a container singleton. `0040` still
    owns the actor wiring and who subscribes first."
  - "2026-10-06 — implementer — the spine was already half-built. `0007` landed
    `FleetTracker` with the seam subscription, the stale mark, DynamicData's
    cache-aware `RefCount()` and `TakeUntil(_shutdown)`, so this item added the
    filter stage and its seeded subject, made `Dispose()` idempotent, and proved
    the eight claims. `SortBy`, `GroupBy` and the description parameter § 7 writes
    out are NOT added here: a comparer and a grouping come from
    `FleetSourceDescription`, which `0032` introduces, and a subject cannot be
    seeded with the description's first comparer before the description exists.
    Rejected: taking `ISchedulerProvider` by constructor now, which no stage in
    this slice uses — the first operator here to need a scheduler is `0033`'s rate
    cap, and an unused dependency is not evidence for B-005."
  - "2026-10-06 — test-writer — B-001 cites `aircraft-source` B-042's test rather
    than adding a second one over the same chain: both claims assert a swap
    rebuilds nothing, and the one test falsifies both (lesson 0006). B-023 and
    B-024 are performed reviews, recorded in § 9 with what was looked at and what
    re-does them. B-023 gets no analyzer rule here: `Layers.IsDownstream` covers
    `Features` and `Gui` only, so reporting a reference out of `Tracking/` means
    widening the analyzer's layer map under a new `TRN` id — `boundary-analyzer`'s
    claim to make, not this Feature's to bolt on."
  - "2026-10-06 — the person — `0007` leaves `depends_on`. What this item needed
    from it — `IFleetTracker` declared, holding the clock, publishing `Fleet` —
    is on `main` at `be7b6ef`. `0007` itself stays open on two claims whose
    subjects are downstream of this item (a view model and the swap decorator),
    so waiting for its close would be waiting on work this item unblocks."
  - "2026-10-06 — the person — `0040` leaves `spikes`. No claim here is about
    registration or who starts the first poll: § 4 row 13 settled the singleton,
    ADR-0009 decision 7 recorded it and `0007` registered it. The spike's open
    questions are startup wiring, which `fleet-dashboard` `0036` still waits on."
  - "2026-10-05 — the person — the observed clock's ticks arrive on a third
    read-side seam, `IObservedClockTicks`, rather than by widening the
    `IObservedClock` `aircraft-source` published (ADR-0010). Lands in `0034`,
    which carries B-018; this item only has to take it by constructor."



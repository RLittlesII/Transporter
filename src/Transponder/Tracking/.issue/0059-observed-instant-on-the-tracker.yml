summary: |
  One member on `IFleetTracker`: the observed instant, and every advance of it.
  `ObservedClock` already publishes that stream through `IObservedClockTicks`
  (ADR-0010) and the client already reports an instant on every applied poll
  (`aircraft-source` B-003), so this item adds no mechanism — it makes an
  existing one reachable from a consumer, which depends on the tracker and
  nothing below it (`aircraft-source` B-041).

  It exists for `fleet-dashboard` B-028: the refresh indicator is set by the
  gesture and has nothing truthful to clear it, because a poll returning
  identical data raises no notice and the actor is told rather than asked.
  `fleet-dashboard` decision 0001 is the call, and `0058` is the item that
  consumes this.

  Depends on nothing. The seam, the clock and its registration are all on
  `main`; the member is re-published from the clock the tracker already holds.

  One trap. The value is the instant the **provider reported**, not a wall-clock
  read and not the moment the changeset arrived — B-018 and ADR-0007 are what
  make that distinction load-bearing, and under replay the recorded instants are
  what a consumer sees. A member that reported `DateTimeOffset.UtcNow` on each
  advance would pass a careless test and be wrong in exactly the demo this
  repository exists to give.

acceptance_criteria:
  - "B-031 — the observed instant published on the tracker, one per applied
    poll, identical data included; the provider's reported value, never a wall
    clock."
  - "§ 9 Traceability Matrix carries a row naming a test for B-031, replacing
    the row that names this item."

decisions: []

delivered: |
  B-031 to `Verified`. `IFleetTracker.Observed` is `IObservedClockTicks.Instant`
  re-published with the tracker's shutdown on it and no operator between — no
  `DistinctUntilChanged`, because the same instant reported twice is two polls and
  deduplicating would leave `fleet-dashboard`'s indicator spinning after the second;
  no `ObserveOn`, because the pipeline marshals for nobody (B-005). No stage, no
  scheduler and no subject added, which is what the risk score said.

  Four tests in `ObservedInstantTests`: the identical poll that raises no notice and
  still publishes an instant, the recorded 2021 instant a wall-clock read would get
  wrong, the in-force value a subscription reads, and disposal completing the stream.
  206 unit tests green.

  **One finding, and it changes `0058` rather than this.** Subscribing to the stream
  is itself an emission — the clock holds the instant in force behind a
  `BehaviorSubject` (ADR-0010), so a subscriber receives it at once, and
  `DateTimeOffset.MinValue` before any poll. A consumer timing a window from a
  gesture must `Skip(1)` or the window ends on the press that opened it. The claim
  is unamended, § 7 and § 10 now say it, `fleet-dashboard` § 7's stream carries the
  skip, and `0058`'s item carries the trap. Rejected: dropping the in-force value,
  which would leave a late subscriber with nothing until the next poll and break the
  staleness re-derivation `Reevaluate` depends on.

out_of_scope:

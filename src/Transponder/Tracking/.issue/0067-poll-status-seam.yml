summary: |
  ADR-0013's seam, built. A provider-agnostic stream in `Tracking/` carrying
  an optional instant the next poll is due and an optional refusal with the
  interval the provider asked for. The tracker re-publishes it on
  `IFleetTracker` (B-040), the move `0059` made for the observed instant.

  Depends on nothing open: the decorator (`SwappingTrackerSource`) and the
  tracker are on `main`. `aircraft-source` `0068` writes the seam for OpenSky,
  and `fleet-dashboard` `0072` binds what the tracker re-publishes.

  B-040's second scenario — a push source swapped in reports none — is proven
  here against a test double that writes the seam; `0068` proves the OpenSky
  poller writes it. B-040 binds only what the tracker re-publishes: the
  decorator switching the status with the live strategy is `aircraft-source`
  B-056, delivered by `0068`.

  Two traps. The tracker re-publishes and produces nothing: no timer, no clock
  read, no countdown — a ticking value would be the timer `fleet-dashboard`
  B-017 forbids, moved one layer down. And a status that survives a swap shows
  the outgoing poller's throttle on the incoming source, which is the swap test
  failing on screen.

acceptance_criteria:

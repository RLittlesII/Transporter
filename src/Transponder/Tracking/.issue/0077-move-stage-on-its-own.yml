summary: |
  `0062` added `Move()` (`FleetMovement.cs`) as the first stage of the fleet
  chain, and every test of it runs through `FleetTracker.Fleet`. Those ten tests
  drive the add, update and remove paths, a swap and a filter. Asked on PR #60
  whether the operator itself was tested, the answer was: only through the
  tracker. Four things about it have no test:

  - the `Refresh` branch: no test sends a refresh through the stage;
  - a changeset that captures nothing is not emitted;
  - `OnError` and `OnCompleted` reach the subscriber;
  - the per-subscription cache dies with the subscription.

  The last two are B-004 and B-028 at the tracker. The existing tests for
  those claims ran before `Move()` was in the chain, and nobody has checked
  that they still exercise it. The first two have no claim. Whether the
  stage owes a refresh pass-through, and whether forwarding an error is
  behaviour the specification states, is spec-author's call before a test is
  written for either. That is why this item is `ready-for-architecture`.

  Two branches look unreachable. One is an update for a key the stage holds no
  element for, which falls back to an entered vehicle. DynamicData's cache
  emits an add before any update for a key. The other falls back to the
  cached vehicle when `change.Previous` is empty, and DynamicData sets
  `Previous` on every update. Each is a guard against a changeset the seam
  cannot produce. Deleting them keeps the stage direct (`coding-conventions`),
  and no test fails, which is the evidence they were dead.

acceptance_criteria:
  - "B-004 — completion and error forwarded through `Move()`, shown by a test that subscribes to the stage directly."
  - "B-028 — the stage's cache released on unsubscribe, shown by the same means."
  - "Refresh pass-through and empty-capture suppression: each has a claim and a test, or a decision row saying why neither is owed."
  - "The two unreachable branches in `FleetMovement.Updated` are deleted, and every existing test still passes."
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - "2026-10-08 — the person — filed as its own item from the PR #60
    question, rather than added to `0062`. Rejected: widening `0062`, whose
    claims B-032, B-033 and B-041 the tracker-level tests already hold."

out_of_scope:
  - "Everything in § 5 of the specification."
  - "Any change to what `Move()` computes. B-032, B-033 and B-041 are `0062`'s and are Verified."

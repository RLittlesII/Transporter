summary: |
  The description gains two things a card needs. Card roles (B-036): which
  column is the title, the subtitle, the place and the ordered readouts, so the
  card is laid out from the description the same way the grid's columns were
  (`fleet-dashboard` B-007, B-021), and a swap to another kind of vehicle
  changes the card without a markup edit. And a delta per readout (B-042): a
  selector over the vehicle B-041 carries and the current one, returning the
  change already formatted — "▲ +120 ft" — or none when nothing changed.

  Waits on `0062` for the replaced vehicle. `fleet-dashboard` `0070` lays the
  card out from the roles, and `0073` shows the delta.

  One trap, and it is § 11 row 3's. Cells are formatted strings, so a
  consumer cannot subtract them; the arithmetic lives in the description,
  beside the unit conversion it needs, and under B-022's exception only. A
  delta computed in a view model from two formatted cells parses its own
  output and breaks on the first locale that writes a decimal comma.

acceptance_criteria:
  - "B-036 — title, subtitle, place and ordered readouts each a column the description holds, or empty."
  - "B-042 — a named delta is the change at its cell's precision, formatted by the description; none where the cell did not change."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."


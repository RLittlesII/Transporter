summary: |
  The aircraft description offers a place column: the nearest entry in the US
  Census Bureau's Gazetteer places within ten kilometres, or the position's
  coordinates when none is that close (B-038, § 11 row 8). The table is
  generated from the Gazetteer file, trimmed to the box the demo flies
  (`aircraft-source` decisions/0001), and compiled in, so resolving a place
  makes no network call and reads no file (§ 4 row 18).

  Depends on nothing open. `fleet-dashboard` `0070` binds the column.

  Three traps. A table read from disk at runtime is the file read B-038
  forbids, and it is the one the Mac Catalyst sandbox refuses silently. A
  nearest-neighbour search over the whole table on every vehicle on every poll
  is a cost that only shows once the fleet is real — a few hundred entries make
  a linear scan honest, but measure before assuming it. And the generator is
  build tooling, not application code: it belongs where `0052`'s recording
  generator does, and its output is what is committed.

acceptance_criteria:
  - "B-038 — the aircraft description offers a place: within ten kilometres by great-circle distance, coordinates beyond it, neither for a vehicle with no position; no network call, and no file or resource read."
  - "§ 9 Traceability Matrix carries a row naming a test for B-038."


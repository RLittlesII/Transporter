summary: |
  The grid becomes cards (B-029), laid out from the description's card roles
  (`fleet-pipeline` B-036) in columns that follow the page's width: title,
  subtitle, place, readouts, the distance since the last poll and since the
  vehicle was first seen (B-030), and the age of its last contact (B-031). A
  stale card is marked by `0069`'s status rule and keeps its place (B-008).

  B-008 moves here from `0038`: the claim was amended from a row to a card, and
  this item builds the card. Nothing of `0038`'s was built against it.

  Waits on `fleet-pipeline` `0062` for the distances, `0064` for the roles and
  `0065` for the place, and on `0069` for the theme and the marks. `0073` waits
  on this one.

  Three traps. A card template that re-creates its children on every change
  flickers the whole fleet once the feed is real — the same hazard B-006
  names for the grid, and it is why `0036` kept a single bound collection; a
  `CollectionView` with a `GridItemsLayout` keeps it. Age is the one piece of
  arithmetic a view model may do — the observed instant minus last contact,
  as display formatting under B-019 (decisions/0002) — and it must use the
  observed instant, never the wall clock, or a replay shows every aircraft as
  years old. And a card that names `Aircraft` to reach altitude is B-022's
  violation; the readouts come from the description.


summary: |
  `fleet-pipeline` B-025 – B-027 publish the notices; this item decides what a
  person sees. Two surfaces, because that was the answer: a banner in the page's
  own markup that always shows the latest notice, and a toast reserved for a
  notice that earns an interruption — the feed going quiet, the feed resuming,
  and the swap completing.

  Both subscribe to `IFleetTracker.Notices(IObservable<TimeSpan>)` separately,
  each paced by its own input field, both editable on stage. No throttling is
  written here: the operator is the pipeline's, tested once
  (`fleet-pipeline` § 4 row 10).

  The view model never names the toast. It exposes the interrupting notices and
  the page calls the toolkit (B-027), which keeps every notice decision in a
  plain class a test drives and leaves the platform call in the one place this
  repository cannot test (§ 4 row 10).

  **The only package this Feature adds**: `CommunityToolkit.Maui` centrally plus
  `UseMauiCommunityToolkit()`, because `Toast` is not in the `.Markup` package
  (§ 4 row 9). The banner needs nothing, so B-023 and B-024 are deliverable even
  if the toolkit addition is refused.

  Runs after `0036`, which builds the page, and `fleet-pipeline` `0033`, which
  raises the notices.

acceptance_criteria:
  - "B-023 — the banner shows the instant and the counts, and computes none of
    them."
  - "B-024 — it changes only when a notice arrives, and overlays no row."
  - "B-025 — a toast only for quiet, resumed and the swap completing; never for
    an ordinary update, at any interval. The rendering half is a review (§ 8)."
  - "B-026 — two input fields, two observables, two cadences, both editable
    while running."
  - "B-027 — no view model names a toast, snackbar or alert type. Analyzer
    rule."
  - "§ 9 Traceability Matrix carries a row naming a test, an analyzer rule or a
    performed review for each id above."

decisions:
  - "2026-10-05 — the person — both surfaces rather than one: a banner that
    always reflects the latest notice and a toast for notices worth
    interrupting for. Rejected: a toast on every arrival, which at the
    15-second poll interval is roughly 180 interruptions in a 45-minute talk,
    each covering the grid it is announcing."
  - "2026-10-05 — the person — the two cadences are independent and are input
    fields on the page, changed live as part of the demo. That is why
    `fleet-pipeline` B-026 paces per subscriber rather than holding one
    interval: two subscriptions, two fields, one rate-cap operator."

out_of_scope:
  - "Everything in § 5 of the specification."
  - "Raising the notices, their counts, the rate-cap operator and the quiet
    threshold (§ 5 row 1) — `fleet-pipeline` B-025 – B-027."
  - "A history or log of past notices — no need in §§ 1-2 asks for one, and the
    banner shows the latest by construction."
  - "Making the **poll** interval a live input — `fleet-pipeline` § 11 row 5
    asks it, and it is `aircraft-source`'s option and its credit budget."

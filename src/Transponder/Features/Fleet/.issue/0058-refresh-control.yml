summary: |
  The gesture half of the refresh: a control on the page, a `Tell` to the actor,
  and an indicator while a demanded poll is outstanding. The view model names no
  client, awaits nothing and never `Ask`s, so whether a poll actually happens is
  the actor's answer and not something this surface predicts — `aircraft-source`
  B-053 holds the throttle, and repeating it here would be a second place the
  rule lives.

  Runs after `0036`, which built the page, and after `0057`, which built the
  actor there is something to tell.

  **Unblocked on 2026-10-07**: § 11 row 6 is answered, and `decisions/0001` is
  the call. The indicator is set by the press and cleared by the next observed
  instant — one per applied poll, identical data included — with a three-second
  cap for the press that was refused and produced no poll at all. That instant
  reaches a view model through `fleet-pipeline` B-031, which is why `0059` is
  now a prerequisite: there is nothing to subscribe to until it lands.

  **One trap, found building `0059` (2026-10-07).** `IFleetTracker.Observed`
  publishes the instant in force on subscription — the clock holds it behind a
  `BehaviorSubject` — so the window must `Skip(1)` or it ends on the press that
  opened it and the indicator is never seen. § 7's stream now carries the skip,
  and `fleet-pipeline` § 10 records why it exists.

  The indicator is a derived value read through `ReactiveMarbles.Mvvm`'s
  `AsValue`, not a property the gesture sets — § 7 carries the stream and what
  each operator in it is for, and this is the repository's first use of
  `AsValue`, so `mvvm` gained the rule that says when to reach for it.

acceptance_criteria:
  - "B-028 — a control that `Tell`s the actor, names no client, awaits nothing,
    and shows it is working while a demanded poll is outstanding."
  - "B-028's indicator clears on the observed instant and on the cap, whichever
    is first, and a second press replaces the window rather than queueing one —
    the three clauses § 7's stream states (decisions/0001)."
  - "§ 9 Traceability Matrix carries a row naming a test and the review for
    B-028, replacing the row that names this item."


summary: |
  The gesture half of the refresh: a control on the page, a `Tell` to the actor,
  and an indicator while a demanded poll is outstanding. The view model names no
  client, awaits nothing and never `Ask`s, so whether a poll actually happens is
  the actor's answer and not something this surface predicts — `aircraft-source`
  B-053 holds the throttle, and repeating it here would be a second place the
  rule lives.

  Runs after `0036`, which built the page, and after `0057`, which builds the
  actor there is something to tell.

  **Blocked, not ready**: § 11's refresh-indicator row is unanswered, and it
  decides what the indicator does. With a `Tell` and no `Ask`, nothing reports
  that the poll finished — a fixed duration clears before slow data lands, and
  the next notice never clears when the poll returned identical data, which is
  a refresh's most ordinary outcome. Either choice is visible on stage, so it is
  the person's, and building first would mean guessing at the one part of this
  item anyone will look at.

acceptance_criteria:
  - "B-028 — a control that `Tell`s the actor, names no client, awaits nothing,
    and shows it is working while a demanded poll is outstanding."
  - "§ 9 Traceability Matrix carries a row naming a test and the review for
    B-028, replacing the row that names this item."
  - "§ 11's refresh-indicator row is answered, and § 7's `IsRefreshing` cell
    states what clears it rather than deferring."


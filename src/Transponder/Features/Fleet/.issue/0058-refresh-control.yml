out_of_scope:
  - "Everything in § 5 of the specification."
  - "The poll itself and its throttle — `aircraft-source` B-053, `0057`."
  - "Whether a view model reaches its actor with `Tell` or `Ask` in general
    (README.md § \"Open items\") — B-028 settles it for this control only."

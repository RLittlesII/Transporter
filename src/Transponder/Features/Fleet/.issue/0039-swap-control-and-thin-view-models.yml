summary: |
  The closing act is performed with this control, in front of people. A swap is
  an effect, so it is told to an actor rather than published as a value
  (`mvvm` § "Two kinds of input, two routes"), and a busy indicator covers it
  until the new fleet arrives — `aircraft-source` decision 0002's call, honoured
  rather than re-decided.

  The rest of the item is the boundaries: what a view model may not hold, what
  it may not compute, what it may not name, and the swap test — that no view is
  edited to show a different source. Four of the six claims are analyzer rules,
  extending the set ADR-0006 established.

  Runs after `0036`, and after `aircraft-source` `0006`, which is the decorator
  this control drives.

  `DemoViewModel` was the existing example of exactly what B-017 forbids — an
  `Ask` continued with `.Result`. `0036` deleted it under B-002 on 2026-10-06, so
  the pattern is no longer in the repository to be copied; this item is what
  makes its absence a rule rather than a tidy-up.

acceptance_criteria:
  - "B-016 — the actor is told, not asked, and the indicator clears when the
    new fleet's first change arrives rather than when the message is sent."
  - "B-017 — no transport, timer, cache write, blocking call or untimed `Ask`
    in a view or view model. Analyzer rule."
  - "B-018 — no filtering, sorting, grouping, expiry or staleness arithmetic in
    a view or view model. Analyzer rule."
  - "B-020 — dependencies stop at the tracker, the query and the actors.
    Analyzer rule."
  - "B-021 — a swap edits no view, markup or comparer."
  - "B-022 — only the detail pane asks which kind of vehicle it has. Analyzer
    rule."
  - "B-040 — a picker over the published targets; no markup per source."
  - "§ 9 Traceability Matrix carries a row naming a test or an analyzer rule
    for each id above."
  - "`aircraft-source` B-041's remaining half — a container-built view model
    depends on `IFleetTracker` and on nothing below it — is proven here under
    B-020, and that Feature's § 9 row names the test. Taken from its `0007`,
    which has no view model to build."
  - "Every registered strategy is a target this control reaches, and the
    recorded aircraft source is one of them: a run that names `Replay:Aircraft`
    can be swapped to the recording from the screen, with no rebuild, no
    restart and no second control (`replay-source` B-015; hot-swap-source
    § \"Never add\"). A run naming no recording offers no such target rather
    than a wrong one (`replay-source` `adr/0001` item 1)."

decisions:
  - "2026-10-09 — the person — a picker over the registered sources, not one
    button per source: one button per source fails B-021's swap test, because
    adding a source would edit markup. `fleet-dashboard` B-040 claims it, and
    the list the picker offers is `aircraft-source` B-057, published by
    registration in `0080`, which `depends_on` now names — a view model
    enumerating strategies would name one (B-020), and the seam may carry no
    name (`aircraft-source` B-037). Also decided: no recording ships inside the
    application (`0079`). `rank` stays 73: the new edge is inbound."
  - "2026-10-07 — the person — the control reaches the recorded aircraft source,
    not only the closing act's ships. Raised when `0052`'s generated recording
    could not be seen on screen: the recording was named, `0012` had registered
    the replay strategy, and nothing in the head sends `SwapSource`, so the only
    way to watch replay run was to put its registration before the live one so
    the selector started on it — a local edit that makes registration order
    decide what is live, which `replay-source` B-015 and its `adr/0001` item 3
    exist to forbid, and which was not committed. `depends_on` gains `0012`,
    the item the strategy this control must reach comes from; `0012`'s `blocks`
    and rank move with it. Rejected: a replay-only control or an offline toggle
    (hot-swap-source § \"Never add\"; `replay-source` § 5 row 8), and a
    configuration key naming the starting source, which is the second control
    hiding in a file that `adr/0001` item 3 rules out. Whether the control is a
    picker over the registered sources or one button per source is
    architecture's; the item records only that replay is among the targets, and
    `fleet-dashboard` § 2 need 5 still reads planes-for-ships — a § 2 / § 3
    amendment is `spec-author`'s."
  - "2026-10-07 — `0055` — `blocks` now names `0001`, and the rank moves 68 to 73 with it. `aircraft-source` B-041's \"what view models depend on\" half needs a container-built view model and is owed here under B-020, which that row already said in prose; the field says it now, so this item unblocks one and the formula reads it. `value` and `risk` are untouched — 4 and 4, as authored."
  - "2026-10-06 — the person — this item takes `aircraft-source` B-041's
    view-model half from that Feature's `0007`, which has no view model to build
    and could not close while holding it (lesson 0011). The claim stays
    `aircraft-source`'s and its § 9 row stays there; only the owing item moved."



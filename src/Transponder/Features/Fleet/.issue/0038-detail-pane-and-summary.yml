summary: |
  The detail pane is the one surface in the application allowed to name a
  concrete `TransportVehicle` subclass (ADR-0005 item 6), and the one place a
  canonical unit is converted for display — in an explicitly named member, never
  inline in a binding. The summary projects what the tracker derived rather
  than recomputing it.

  Runs after `0036`, which builds the pane, and after `fleet-pipeline` `0034`,
  which derives the mark this item displays. B-015 additionally binds what
  `fleet-pipeline` `0033` derives; the dependency on `0034` carries the ordering
  because `0033` waits on `0034` already.

  Two hazards. Legal-here reads as legal-everywhere to the next reader, so the
  pane's downcast is the one the analyzer rule B-022 names has to keep bounded.
  And a selection that outlives its vehicle shows a row the grid does not have,
  with nothing erroring.

acceptance_criteria:
  - "B-013 — the pane shows fields only a concrete vehicle reports, and no
    other surface named one to do it."
  - "B-014 — a selection does not outlive its vehicle; the pane empties."
  - "B-015 — the summary is projected, never recomputed in a view model."
  - "B-019 — a unit is converted in a named member and the domain value is
    unchanged."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."


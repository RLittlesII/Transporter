summary: |
  The detail pane draws the selected vehicle's trail on a map (B-034),
  coloured across the trail measure's range by a ramp that stays ordered
  under protan, deutan and tritan vision, broken where a point follows a gap,
  and following the trail rather than redrawn from empty: extended at its
  head as a point is added, and trimmed at its tail as the trail's bound drops
  one. Beside it, a
  list of the same trail newest first (B-035), each point with its last contact
  and its distance from the point before.

  Adds `Microsoft.Maui.Controls.Maps` centrally and one builder call (§ 4 row
  12). Which heads draw a map is read when this item is taken; a head that
  draws none still has the list.

  Waits on `fleet-pipeline` `0063` for the trail, and on `0038`, which builds
  the pane this draws in.

  Three traps. A polyline rebuilt on every update flickers and spends the
  renderer on points that did not change. A ramp chosen by eye is the rainbow
  that collapses under deuteranopia; use a sequential ramp, as the design system
  does. And the list must bind the trail's own distances: summing them in the
  view model is B-018's violation.

acceptance_criteria:
  - "B-034 — the trail on a map, ramped across the measure, broken at gaps, extended at its head and trimmed at its tail, never redrawn from empty."
  - "B-035 — the trail listed newest first, bound and computing nothing."
  - "§ 9 Traceability Matrix carries a row naming a test or a performed review for each id above."


summary: |
  `TRN0002` fires on `replay-source`'s replay contract for naming the envelope
  its own signature returns, so `0011` cannot compile:

    error TRN0002: 'Transponder.Integrations.OpenSky.Replay.ReplayOpenSkyApi' names
    'OpenSkyStatesResponse', which only the contract's implementation and the snapshot
    client may name (aircraft-source B-045)

  The descriptor's own message names the holder correctly — "the contract's
  implementation". The analysis did not: it allowed `Layers.IsTransport`, which
  answers "anywhere under `.../Http`", and `Layers.IsClientHome`, which answers
  "a type whose name ends in Client". Both were true readings of the one
  implementation that existed when the rule was written, and `aircraft-source`
  B-045 never said either — it says "the class implementing the API contract",
  and ADR-0002 allows a provider more than one of those.

  The fix reads the contract instead of the folder: `Layers.IsContractHome`
  answers from the interfaces a class adheres to, so an implementation over HTTP
  and an implementation over a recording are both the class B-045 names.
  Everything else is reported exactly as before — a class beside the replay
  contract that implements nothing still takes `TRN0002` for naming the
  envelope.

acceptance_criteria:
  - "A second implementation of a provider's contract, outside the transport
    namespace, compiles while naming the envelope and the row."
  - "A type in the same namespace that implements no contract is still
    reported — the pair is one test, because the fix is the contract and not
    the folder."
  - "The existing `TRN0002` tests are unchanged and pass: the transport is
    still allowed, and a composition root naming the row is still reported."
  - "`src/Transponder.Analyzers/.spec/README.md` § 7 says what `TRN0002`
    examines, and a Feature lesson records why the rule drifted."

decisions:
  - "2026-10-06 — implementer — fixed in `0011`'s pull request rather than in a
    boundary-analyzer pull request of its own, which is the call the person made
    on `0045` for the same situation: the blocked item cannot compile without
    the fix, and a separate pull request holds it in-progress across a round
    trip. Rejected: suppressing `TRN0002` on the replay contract, which silences
    the rule for the one layer `replay-source` adds; and filing the recording
    under `.../Http`, which would call a file a transport over HTTP to satisfy
    a namespace check."
  - "2026-10-06 — implementer — no claim changed and no descriptor changed.
    B-008 still fixes the set at seventeen rules, and `aircraft-source` B-045 is
    unamended — the analysis now matches the claim and the message it already
    printed. § 11 row 3 of this specification is untouched: this is not a
    `replay-source` claim being carried here, it is a `replay-source` component
    being reported by a rule that enforces an `aircraft-source` one."

out_of_scope:
  - "Widening what may name the envelope beyond B-045 — a contract
    implementation and the snapshot client, and nothing else."
  - "A rule for any `replay-source` claim — § 11 row 3, and still
    `spec-author`'s."

summary: |
  TRN0002 – TRN0007, six of the seven rules ADR-0006 exists for: the envelope
  and row confined to two types, the snapshot dying at the
  projection, nothing upstream named from below IFleetTracker, no domain type in
  the cache, no strategy or client or cache or decorator named by a view model,
  and no imperative mutation of a bound collection.

  They are evaluated over the semantic model including method bodies — a local,
  a new, a cast, a generic argument supplied at a call site, a type named only
  inside a method. That is the single constraint that ruled out reflection
  (ADR-0006 § Context): a signature-only rule reports a view model as satisfied
  while it constructs an envelope in a method and throws it away, which is the
  violation the claim exists to catch.

  § 11 row 1 is answered — a rule identifies a layer by its containing
  namespace, read against the layout transponder-conventions
  references/coding.md § "Project structure" fixes, recorded as features/boundary-analyzer/.spec/adr/0002. The
  classification lives in Layers.cs, which 0021 lands, so these six rules read
  it rather than each deciding what a layer is.

  TRN0001 moved to 0021: B-004 and B-005 are claims about where a diagnostic
  lands and whether generated code is exempt, and neither can be proven without
  one rule that actually reports. This item is TRN0002 – TRN0007.

  The hazard runs both ways and only one direction is visible: a rule written too
  broadly stops work that was never wrong and gets switched off in
  .editorconfig; a rule written too narrowly reports nothing, the aircraft-source
  § 9 row reads Verified, and the boundary is unenforced while the matrix says
  otherwise.


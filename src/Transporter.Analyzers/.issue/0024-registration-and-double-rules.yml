summary: |
  TRN0015 – TRN0018, the four rules whose subject is a call rather than a type:
  no implementation type resolvable from outside the integration and one alias
  per constructed chain, the cache as a plain keyed store rather than a type of
  its own, one cache per client at the application's lifetime, and — the
  mocking-framework half of aircraft-source B-010 — the contract's double not
  produced by a mocking framework.

  All four are read at the call site, because that is where the answer is. A
  lifetime and an alias are arguments to a registration, and an implementation
  type's own declaration is unchanged and legal in every case the rule has to
  report. Reporting on the type would put the diagnostic on a line nobody can
  fix.

  The most brittle family of the three. A registration is an extension-method
  call whose shape varies — a generic argument or a typeof, a lambda factory or
  a type, a lifetime in the method name or in a parameter — and a rule keyed to
  one spelling misses the others while the aircraft-source § 9 row still flips
  to Verified. Enumerate the spellings this repository actually uses, in
  src/Gui/Container, and report an unrecognized one rather than passing it.

acceptance_criteria:

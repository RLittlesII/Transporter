    a CodeFixProvider needs Microsoft.CodeAnalysis.Workspaces and an analyzer must
    not carry it into the compiler's load path (source-generators § Project
    Structure). TRN0017 ship a code fix with the rule, and § 7 records why the
    rest of this item's rules have none. TRN0017 rewrites the cache registration to the application lifetime — one call,
    one argument. TRN0015 and TRN0016 need an alias that may not exist yet and
    TRN0018 needs a type written, so § 7 records why they have none."
  - "B-011 — a forbidden registration is reported at the registration call, not
    on the registered type's declaration."
  - "B-012 — a double obtained from a mocking framework is reported at that
    call, and the hand-written fake is not reported."
  - "§ 9 carries a row naming a test for each id above."
  - "Each of the four claims is proven by the test aircraft-source § 9 names for
    it, under that name (B-016); B-010's other half stays an xUnit test over the
    fake, as that matrix records."
  - "A registration spelling the rule does not recognize is reported rather than
    treated as compliant."


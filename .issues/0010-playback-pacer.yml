summary: |
  Reads an NDJSON recording and yields each payload in recorded order at the
  recorded inter-arrival spacing, looping at the end without completing,
  faulting, or emitting a changeset that empties the fleet at the loop boundary.
  A torn final line is discarded and the stream carries on, because a recording
  truncated mid-write is the normal result of stopping a rehearsal.

  It hands back the payload still raw, which is what keeps a recording replayable
  after a converter fix (B-014). Parsing belongs to whatever substitutes over it
  — 0011 for aircraft, 0013 for vessels.

  It is handed an **opened stream** and resolves no path of its own (B-027), so
  file access stays out of the component that owns the time base. That was the
  open question this item carried; the Feature's `adr/0001` answered it.

  Nothing blocks it: it needs no provider, no credential, no network and now no
  filesystem either, and it is testable against a synthetic fixture with an
  injected scheduler. It is also
  what both substitution points are built on, which is why it ranks highest of
  the replay items.

acceptance_criteria:
  - "B-007 — recorded order at recorded inter-arrival spacing, derived from the
    recorded instants; no fixed interval substituted."
  - "B-008 — loops to the first payload at the end; the stream does not
    complete or fault, and no changeset removes every vehicle at the boundary."
  - "B-011 — no network request and no credential; runs to completion with the
    provider unreachable and no secrets configured. This is what lets CI
    exercise the pipeline end to end (user need 5)."
  - "B-012 — a torn or unparseable final line is discarded and the stream
    continues."
  - "B-014 — a recording stays replayable after a converter fix with no
    re-recording, which is what the payload staying raw is for."

decisions:
  - "2026-10-04 — spec-author — the pacer yields raw payloads rather than parsed
    envelopes, so B-014 holds and so a push recording (0013) can use the same
    component. Rejected: parsing here, which would put a converter below the
    substitution point and give aircraft and vessels two different pacers."

out_of_scope:
  - "Transport controls — seek, pause, scrub, step, speed (§ 5 row 5). Playback
    is forward and looping, and ADR-0004 deliberately buys no index to seek
    with."
  - "Deciding which recording to load and from where — now answered, and not
    here: naming, root resolution and the startup report are B-024 – B-026 on
    item 0012. B-027 is this item's half of that answer, and it is a negative
    claim: resolve nothing, open nothing, take the stream you are given."
  - "Parsing a payload into an envelope or a domain object, and the observed
    instant and staleness that follow from it (B-009, B-010, B-013) — 0011."
  - "The real `Thread.Sleep`: § 4's no-wall-clock rule means the spacing comes
    from an injected scheduler in production, not only in tests."

summary: |
  The headline mechanism and the largest item: `AircraftSnapshotClient` takes
  the contract and the cache by constructor, reads every field of an 18-element
  row by positional index, and applies each fetched set to its cache as one
  differential update. That differential write is the step the talk exists to
  show, and after this item it has an address in the source.

  Carries the provider's awkward facts too: token refresh on expiry *and* on
  `401`, `429` treated as data and deferred by exactly the header's seconds,
  `X-Rate-Limit-Remaining` logged at debug, and a startup failure naming an
  absent credential. A failed poll must not terminate the stream.

  Needs the contract (0002) to call and the cache (0003) to write to, so it
  runs after both — they touch the same seam and must not run side by side.
  The recording tap (0009) taps this client, which is why this item unblocks
  two.

acceptance_criteria:
  - "B-015 — contract and cache by constructor; constructs neither."
  - "B-016 — every field read by its own positional index per README.md
    § \"Response shape\"."
  - "B-017 — a `null` element is carried as absent, never defaulted to `0`,
    `false` or an empty string."
  - "B-018 — a 17-element row yields an absent category; an 18-element row with
    index 17 of `0` yields a category present with value 0. The two are
    distinguishable."
  - "B-019 — 8-character callsign padding removed; padding-only is absent."
  - "B-020 — squawk is a string and keeps its leading zeros."
  - "B-021 — `sensors` (index 12) is read past deliberately and reaches no
    type."
  - "B-022 — an unreadable row is excluded and counted without aborting the
    rest."
  - "B-023 — every fetched set is written to the cache as a differential update
    over the whole set, and the snapshot changeset stream is exposed. This is
    the claim the demo's core idea rests on."
  - "B-024 — box and interval arrive by constructor or options, never on the
    contract or the stream."
  - "B-025 — `extended=1` when category grouping is offered; without it the
    category is absent rather than defaulted."
  - "B-026 — token refreshed on expiry and on `401`, with the request retried
    once after a successful refresh."
  - "B-027 — `X-Rate-Limit-Remaining` logged at debug, and no token,
    `client_id` or `client_secret` value in any log line, exception message,
    fixture or diagnostic."
  - "B-028 — `429` handled as data and deferred by exactly
    `X-Rate-Limit-Retry-After-Seconds`; every other non-2xx stays an exception."
  - "B-029 — a missing credential fails at startup naming which one; a failed
    poll never completes or error-terminates the stream."
  - "B-045 — the envelope and the positional row are referenced only by the
    contract's implementation and by this client. Falsifiable here for the
    first time, because this is the second and last referent."
  - "B-050 — interval configurable, defaulting to 15 seconds; box configurable
    with no default compiled in (decisions/0001)."


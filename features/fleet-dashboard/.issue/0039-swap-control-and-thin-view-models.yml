summary: |
  The closing act is performed with this control, in front of people. A swap is
  an effect, so it is told to an actor rather than published as a value
  (`mvvm` § "Two kinds of input, two routes"), and a busy indicator covers it
  until the new fleet arrives — `aircraft-source` decision 0002's call, honoured
  rather than re-decided.

  The rest of the item is the boundaries: what a view model may not hold, what
  it may not compute, what it may not name, and the swap test — that no view is
  edited to show a different source. Four of the six claims are analyzer rules,
  extending the set ADR-0006 established.

  Runs after `0036`, and after `aircraft-source` `0006`, which is the decorator
  this control drives.

  `DemoViewModel` is the existing example of exactly what B-017 forbids — an
  `Ask` continued with `.Result` — so the pattern is in the repository to be
  copied. `0036` removes it under B-002; this item is what makes its absence a
  rule rather than a tidy-up.

acceptance_criteria:
  - "B-016 — the actor is told, not asked, and the indicator clears when the
    new fleet's first change arrives rather than when the message is sent."
  - "B-017 — no transport, timer, cache write, blocking call or untimed `Ask`
    in a view or view model. Analyzer rule."
  - "B-018 — no filtering, sorting, grouping, expiry or staleness arithmetic in
    a view or view model. Analyzer rule."
  - "B-020 — dependencies stop at the tracker, the query and the actors.
    Analyzer rule."
  - "B-021 — a swap edits no view, markup or comparer."
  - "B-022 — only the detail pane asks which kind of vehicle it has. Analyzer
    rule."
  - "§ 9 Traceability Matrix carries a row naming a test or an analyzer rule
    for each id above."


summary: |
    The swap decorator starts on the first registered strategy
    (`SwappingTrackerSource`), and `AddOpenSky` happens to be called before
    `AddAircraftReplay`. Nothing says so and nothing tests it, which is why
    swapping two lines in `TransponderRegistration` was enough to start on a
    recording — the local edit `0039`'s 2026-10-07 decision describes. This item
    makes the order a claim with a test, so that edit fails the build instead of
    quietly working.

    Waits on `0012`, which registered the replay strategy whose position this
    asserts. No production change is expected; if the test finds one needed, it
    is a registration change only.


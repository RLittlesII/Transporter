summary: |
  As the presenter I want to finish the talk when the venue network dies
  mid-sentence, and as a developer in the audience I want to watch a recording
  drive the same grid the live feed drove, so that "the pipeline does not care
  where the data comes from" is demonstrated rather than asserted.

  Parent of the replay path: a recorder that taps a live source and writes the
  provider's payloads verbatim, a pacer that feeds them back at their recorded
  spacing, and two substitution points — the contract for aircraft, the strategy
  for vessels, with the recording named in configuration rather than discovered.
  Five children; it holds no work of its own.

  Claim ids here resolve against features/replay-source/.spec/README.md, not
  against aircraft-source. Both specs number from B-001 and the ids are
  different claims, per spec-and-traceability § "Claim IDs are `B-00n`".

acceptance_criteria:
  - "All 28 claims in § 3 of the replay spec, carried once each. Which child
    takes which is each child's own `claims:` list, indexed in the
    specification's `## Tasks`."
  - "§ 9 has no Missing row once every child is done."

decisions:
  - "2026-10-07 — `0055` — `blocked` rather than `ready-for-implementation`, because nothing under it can be picked up. Four of five children are `done` through `0012`; the fifth, `0013`, is blocked on the vessel feed's specification (§ 5 row 2), and the last claim this parent still owes outside it, B-005, waits on a captured recording (`0052`). Neither is work anyone can start, and `ready-for-implementation` was putting this in the pickable list."
  - "2026-10-06 — test-writer — §§ 8 and 9 are written, so the specification is
    complete and the statuses move: `0009` and `0010` to `ready` with every
    dependency landed, `0011` and `0012` to `ready-for-implementation` behind
    theirs, this item with them, and `0013` left `blocked` on the vessel
    feed's unwritten specification. All twenty-seven § 9 rows read `Missing`
    and each names what will prove its claim. Four are blocked on something
    other than work: B-005 on a recording nobody has captured, B-019 and
    B-023 on that unwritten specification, and B-011 on `0012` rather than on
    `0010`, which holds the claim — a reassignment in § Tasks is the remedy
    and `spec-author`'s to make. Four claims take a review rather than a test
    (B-005, B-006, B-020, B-021): the repository answers a structural claim
    with a compiler diagnostic, the boundary analyzer carries no rule bearing
    on any of them, and a test over a declaration is lesson 0006's mistake."
  - "2026-10-06 — implementer — §§ 6 and 7 of the specification are written,
    covering every child including `0013`'s vessel half, which is designed and
    still unbuildable. Four calls the design makes and the records did not:
    the cadence lives in the pacer and the replay chain's client is given an
    interval of zero, because the live client's own loop would otherwise add
    its interval to every recorded gap; the replay chain is a second instance
    of the live classes with its own cache and its own per-type seam, because
    `SwappingTrackerSource.Select` resolves a strategy by type and two
    instances of one class cannot be told apart; the recording tap sits below
    deserialization in the HTTP pipeline, because a decorator over
    `IOpenSkyApi` sees a reconstructed envelope and B-002 says verbatim; and
    B-026's report leaves a bad recording's source unregistered rather than
    failing the host. Statuses do not move: § 9 is the gate and `test-writer`
    owes §§ 8 and 9, which no part of this pass writes."
  - "2026-10-06 — the person — re-valued from 4 to 5, so `rank` is 88. `0036`
    put a fleet page on the screen and `0047` made the application open it, and
    what it opens onto is an empty grid: the live provider needs credentials no
    developer's machine should be the only holder of, and
    `transporter-conventions` § \"Verify and publish\" step 3 already says to
    launch against a recorded or simulated source. Until this Feature lands,
    that step has nothing behind it and no screen is ever looked at running."
  - "2026-10-04 — spec-author — cut into five children on component boundaries
    rather than on the spec's five claim groups. The groups split recording from
    playback from selection, but B-009, B-010 and B-013 belong with the
    substitution point that makes them true rather than with playback, and the
    two substitution points are different components."
  - "2026-10-04 — spec-author — the value of 4 rather than 5: the headline demo
    runs without replay on a good network, which makes this resilience rather
    than the goal itself. README § \"Demo resilience\" and user needs 1, 2 and 5
    are what justify 4 — a stated goal materially degraded without it."


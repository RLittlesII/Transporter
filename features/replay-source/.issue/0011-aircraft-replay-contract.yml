summary: |
  A replay implementation of the OpenSky contract, handing back recorded
  envelopes from the pacer. The live path's own snapshot client, cache and
  projection are constructed over it unchanged — the same client class, not a
  second one — and that whole chain registers as another
  `ITrackerSourceStrategy`, which is where the selector finds it. It said
  `ITrackerSource` until ADR-0011 superseded ADR-0003: a strategy registered
  as the seam reaches consumers in place of the selector, so the swap does
  nothing.

  This is the item the per-transport amendment to aircraft-source B-007 and
  B-008 exists for, and the reason it won: because a recording is the provider's
  envelope verbatim, the recorded envelope carries the provider's own reported
  time, so the observed instant (B-009) and staleness-on-replay (B-010) come free
  with no second implementation to re-derive them. ADR-0002 § "Decision" item 2
  carries the reasoning.

  aircraft-source B-045 is not widened: this item introduces no client, so the
  envelope and the positional row stay restricted to the two components that
  claim names.

  Needs the live projection (0005, and transitively the client and the contract)
  and the pacer (0010).

acceptance_criteria:
  - "B-022 — the substitution point: the provider's own contract, with no
    client, cache, converter or projection introduced here."
  - "B-009, B-010 — the replayed payload's own reported time as the observed
    instant, and staleness on the recording's time base. These two are the
    item's hazard: they are the claims most easily confused with each other."
  - "B-013 — the live projection, with no second converter for recorded
    payloads."
  - "aircraft-source B-007 holds as amended — this is the second and last
    implementation of that contract, one per transport."
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - "2026-10-06 — implementer — the § 12 sign-off gate is waived for this item,
    the second item in a row to need it. All three rows of the specification's
    § 12 still read 🟡 Draft and `spec_status` is `draft`, and the section is
    `spec-reviewer`'s — an implementer may not flip the rows it would be
    clearing for itself. The person directed this item by name after `0010`
    landed, which is the authority this waiver rests on; it is named to `0011`
    alone and is not standing, exactly as `0010`'s was. What would end the
    pattern is the person signing § 12 or `0026` landing, and neither is this
    item's to do — `0013` will need a third waiver otherwise."
  - "2026-10-06 — implementer — the summary said this chain registers as
    another `ITrackerSource`, which ADR-0011 forbids; corrected to
    `ITrackerSourceStrategy`. § 11 row 1 of the specification carried the same
    sentence and is corrected with it. Both predate `0049`, which ran ADR-0003's
    library and found the registration shape the record described could not be
    built. § 7 also narrows \"the same client class\" to a second *instance* of
    it over its own cache — one shared cache would leave the outgoing feed's
    aircraft under the incoming one."

out_of_scope:
  - "Widening aircraft-source B-045 — settled the other way (§ 4 row 4)."
  - "A replay client, cache or projection of its own — forbidden by B-022, and
    the rejected option in ADR-0002."
  - "Vessel replay (B-023) — 0013, and it cannot mirror this."
  - "Selecting replay and stopping the outgoing source (B-015 – B-018) — 0012."

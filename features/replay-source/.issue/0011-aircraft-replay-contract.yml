summary: |
  A replay implementation of the OpenSky contract, handing back recorded
  envelopes from the pacer. The live path's own snapshot client, cache and
  projection are constructed over it unchanged — the same client class, not a
  second one — and that whole chain registers as another
  `ITrackerSourceStrategy`, which is where the selector finds it. It said
  `ITrackerSource` until ADR-0011 superseded ADR-0003: a strategy registered
  as the seam reaches consumers in place of the selector, so the swap does
  nothing.

  This is the item the per-transport amendment to aircraft-source B-007 and
  B-008 exists for, and the reason it won: because a recording is the provider's
  envelope verbatim, the recorded envelope carries the provider's own reported
  time, so the observed instant (B-009) and staleness-on-replay (B-010) come free
  with no second implementation to re-derive them. ADR-0002 § "Decision" item 2
  carries the reasoning.

  aircraft-source B-045 is not widened: this item introduces no client, so the
  envelope and the positional row stay restricted to the two components that
  claim names.

  Needs the live projection (0005, and transitively the client and the contract)
  and the pacer (0010).

acceptance_criteria:
  - "B-022 — the substitution point: the provider's own contract, with no
    client, cache, converter or projection introduced here."
  - "B-009, B-010 — the replayed payload's own reported time as the observed
    instant, and staleness on the recording's time base. These two are the
    item's hazard: they are the claims most easily confused with each other."
  - "B-013 — the live projection, with no second converter for recorded
    payloads."
  - "aircraft-source B-007 holds as amended — this is the second and last
    implementation of that contract, one per transport."
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - "2026-10-06 — implementer — closed on all four of its own claims, and it
    moved two of `0010`'s. B-009, B-010, B-013 and B-022 are `Verified` against
    `ReplayOpenSkyApiTests`, `ReplayStalenessTests` and `ReplayCompositionTests`,
    and B-022's review half is performed and recorded in its § 9 row. B-014 and
    B-007's client half were rows `0010` held and could not write, and both read
    `Verified` now — which is the outcome § 8's findings for `spec-author`
    predicted when `0010` closed on three of six rather than waiting. B-011 is
    the one row still held by `0010` and owed by `0012`."
  - "2026-10-06 — implementer — the chain is registered piece by piece under a
    key rather than built by one factory: the pacer, the contract, the cache,
    the options and the client each have a keyed registration and the live
    chain keeps its unkeyed ones. \"The same class, a second instance\" is then
    something the container expresses, and the composition test resolves each
    piece instead of reaching into an object graph. Rejected: one factory
    returning the assembled strategy, which makes B-022's own assertion a
    matter of reading the factory."
  - "2026-10-06 — implementer — the replay strategy is a type that forwards
    `Connect` to the live one under a seam of its own. `AircraftTrackerSource`
    adheres to `IAircraftTrackerSource`, and `SwappingTrackerSource.Select`
    resolves a strategy by `Single(seam.IsInstanceOfType)` — so two instances of
    it registered as strategies would both answer that seam and every swap would
    throw. Rejected: adhering to both seams, which leaves the ambiguity where it
    was; and splitting the live class into a live and a replay subclass, which
    edits a delivered type of another Feature to say what one line of delegation
    says. § 7 carries it."
  - "2026-10-06 — implementer — a recorded body that is not a states payload is
    discarded and the next line is read, with a bound of a thousand in a row.
    B-012 makes a complete-but-unreadable line cost one payload, and the
    contract is where a body is read, so the discard belongs here rather than in
    the pacer. The bound is the point: this chain's interval is zero, so a call
    that failed would be answered immediately and asked again and the loop would
    spin a core rather than wait — the hazard the zero interval creates, now
    stated in § 7 beside it."
  - "2026-10-06 — implementer — the chain registers behind
    `IAircraftReplayTrackerSource` and not as an `ITrackerSourceStrategy`.
    Selecting replay is B-015 – B-018 and `0012`'s, along with the recording's
    name, its root and the startup report; registering the alias here would make
    replay selectable before anything reports whether its recording can be read.
    Nothing this item adds changes the live chain's behaviour, which is what the
    live composition tests still passing says."
  - "2026-10-06 — implementer — `TRN0002` reported the replay contract for
    naming the envelope its own signature returns, and the rule was fixed in
    this item's pull request rather than in a boundary-analyzer one of its own.
    That is the call the person made on `0045` for the same situation: the
    blocked item cannot compile without it. Filed as analyzer item `0053` with
    its own lesson; no claim and no descriptor changed, because the rule now
    asks what a class implements, which is what `aircraft-source` B-045 says and
    what the message already printed. Rejected: suppressing the diagnostic on
    the replay contract, and filing the recording under `.../Http` to satisfy a
    namespace check."
  - "2026-10-06 — implementer — the first cadence and staleness tests asserted
    on state read straight after `AdvanceBy`, which races a chain whose waits
    are scheduled from inside awaited tasks: the continuation resumes on the
    thread pool, and the loop's next wait is then scheduled from a later clock,
    so it drifts and reads as a subject that stopped. Both tests now drive an
    awaitable fetch and await it, and the staleness test hands its strategy a
    client that polls nothing. Root lesson 0020 records it, `test-from-scenarios`
    § \"Time is injected, always\" gained the rule, and § 8 carries it as this
    Feature's fourth trap."
  - "2026-10-06 — implementer — the § 12 sign-off gate is waived for this item,
    the second item in a row to need it. All three rows of the specification's
    § 12 still read 🟡 Draft and `spec_status` is `draft`, and the section is
    `spec-reviewer`'s — an implementer may not flip the rows it would be
    clearing for itself. The person directed this item by name after `0010`
    landed, which is the authority this waiver rests on; it is named to `0011`
    alone and is not standing, exactly as `0010`'s was. What would end the
    pattern is the person signing § 12 or `0026` landing, and neither is this
    item's to do — `0013` will need a third waiver otherwise."
  - "2026-10-06 — implementer — the summary said this chain registers as
    another `ITrackerSource`, which ADR-0011 forbids; corrected to
    `ITrackerSourceStrategy`. § 11 row 1 of the specification carried the same
    sentence and is corrected with it. Both predate `0049`, which ran ADR-0003's
    library and found the registration shape the record described could not be
    built. § 7 also narrows \"the same client class\" to a second *instance* of
    it over its own cache — one shared cache would leave the outgoing feed's
    aircraft under the incoming one."


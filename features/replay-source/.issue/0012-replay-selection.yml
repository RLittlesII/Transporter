summary: |
  Replay registers as one more strategy and is selected by the same decorator
  that selects any live source. There is no offline-mode flag, no replay-only
  selector and no second selection path — which is the point of the whole
  Feature for the audience, and the thing most likely to be added under pressure
  on stage.

  Swapping to replay stops the outgoing source, so a swapped-out poller stops
  spending credits, and nothing downstream is rebuilt: not the tracker, its
  collection, its filters, its sorts, its groups or its bindings.

  It is also where a run's recording is named. One configuration key per replay
  source, through the same mechanism the interval and the bounding box use, with
  **no recording compiled in as a default**: a source with none named is not
  registered and so is not selectable, which is a visible absence rather than a
  wrong recording. Paths resolve against one configured recordings root
  (`recordings/` beside the application by default), and a recording that is
  absent, unreadable or shorter than the staleness threshold is reported at
  startup rather than discovered at the swap. Configuration never decides
  *whether* replay is live — the selector does (B-015) — so a recording named
  but never selected is normal. The Feature's `adr/0001` records all of it.

  Needs the decorator (0006) and something to swap to (0011).

acceptance_criteria:
  - "B-015, B-016 — selected like any live source, and unobservable from the
    seam. No offline-mode flag and no second selection path."
  - "B-017, B-018 — the outgoing source stops, and nothing downstream is
    rebuilt."
  - "B-024, B-025 — a recording named in configuration with no default, and
    resolved against one configured root."
  - "B-026 — absent, unreadable or too-short reported at startup, never first
    discovered at the swap."
  - "Replay registers as an `ITrackerSourceStrategy`, which is where the
    selector finds it — never as `ITrackerSource` itself, which would hand
    replay to consumers in place of the selector (ADR-0011 § Decision,
    § 4 row 12, hot-swap-source)."
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - "2026-10-06 — implementer — § 7's open decision lands here, and it is the
    person's: B-011 claims replay runs with no credential configured, while
    `AddOpenSky` registers the credentials with `ValidateOnStart`, so an
    application composing the OpenSky integration refuses to start without
    them. A recordings-only laptop therefore cannot run the demo at all —
    the scenario this Feature exists for. § 7 § \"Decision required\" names
    three options and recommends making credential validation conditional on
    a live source being registered; until it is answered, this item's
    registration cannot be written to satisfy B-011 above the unit level."
  - "2026-10-06 — `0049` — risk lowered 4 to 3, and the rank with it. ADR-0003
    is superseded by ADR-0011 after the library it named was run: `Decorate<>`
    wraps one registration at a time, so the ordering hazard half of the stack
    below never existed in a design that could be built. The recording hazard stands,
    and the registration trap that replaces the ordering one is visible to the
    composition test."
  - "2026-10-04 — spec-author — risk raised 3 to 4 when B-024 – B-026 landed
    here. Two registration-time hazards now stack, and neither shows at runtime:
    a strategy registered after Scrutor's `Decorate<>` call resolves raw so the
    swap silently does nothing, and a recording named but absent or too short is
    a stage failure unless B-026's startup report catches it first."


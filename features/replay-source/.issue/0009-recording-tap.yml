summary: |
  The recorder is a tap, not a second source. It writes what a live source has
  already fetched — one NDJSON line per payload, the provider's bytes verbatim
  beside the instant they arrived (ADR-0004) — so recording a rehearsal costs no
  extra credit and opens no extra socket, and the changesets reaching the fleet
  are identical whether it is on or off.

  Raw rather than parsed is the whole point: a recording stays replayable after a
  converter fix (B-014, in 0010), which parsing at record time would foreclose.

  **The tap sits below deserialization, not at the snapshot client.** This
  summary said "taps the aircraft snapshot client" until § 7 was written: the
  client is handed an `OpenSkyStatesResponse` that has already been through a
  reader, and recording that is recording this repository's reading of the
  payload rather than the payload. So the tap is in the OpenSky HTTP transport,
  where the response body is still a string. Runs after 0004, which built that
  transport and the client above it.

acceptance_criteria:
  - "B-001, B-002 — the recorded line's format, and verbatim meaning verbatim."
  - "B-003, B-004 — no request of its own, and observationally transparent.
    Recording costs no credit and the fleet cannot tell it is on."
  - "B-005 — a stage recording spans the staleness threshold, so appearance,
    update and staleness are all reproducible from it."
  - "B-006 — a rehearsal recording is never committed, and never a fixture
    unscrubbed."
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - "2026-10-06 — review of pull request #39 — `IRecordingWriter.Write`
    returns `Task` and the line is written in one call. A `void` member over a
    file commits every caller to blocking a thread before any caller exists,
    and the one production caller is a poll already inside an `async` method;
    declaring it the other way costs nothing where there is nothing to await,
    since `UnrecordedPayloads` returns a completed task. The whole-line write
    came with it: six writes per line is a line another writer can split, which
    no test could show. Neither rule was written anywhere —
    `coding-conventions` banned a blocking wait on an asynchronous call and
    said nothing about a signature that forces one — so § Design gained both
    halves and lesson 0018 records it."
  - "2026-10-06 — review of pull request #39 — the writer's tests build it
    through a generated `RecordingWriterFixture` rather than by constructor
    call, which `transponder-conventions` § testing already required in
    writing. No new rule, only compliance — lesson 0017's shape. The generated
    builder is `WithDestination`, not `WithWriter`: the naming rule as written
    said \"after its parameter's type\", which holds for an interface and not
    for a class, where it is the parameter's name. The reference is corrected
    and now says to read the generated file rather than predict the name."
  - "2026-10-06 — implementer — the tap reads the response body as text and
    deserializes from that text, replacing `GetJsonAsync<T>` in
    `OpenSkyHttpApi.Read`. That is the only place B-002's verbatim is
    obtainable; above it the payload has already been through a reader. The
    cost is one string per poll with recording off as well as on, which is
    accepted because the alternative — a second read path used only while
    recording — is a branch B-004 would then have to be proven across."
  - "2026-10-06 — implementer — `IRecordingWriter` is always injected and a
    null object, `UnrecordedPayloads`, answers when recording is off. B-004 is
    then true by construction: there is no branch in the transport that could
    behave differently with recording on, and the only difference between the
    two runs is which implementation the container resolved."
  - "2026-10-06 — implementer — ADR-0004's one-line-per-payload and B-002's
    verbatim cannot both hold for a payload containing a line break. Verbatim
    wins and the broken shape is logged: B-002 forbids omitting or reshaping a
    payload outright, where the line shape is a `proposed` record's. Rejected:
    minifying the body, which parses what the record says is unparsed and
    would turn `1250.0` into `1250` — \"verbatim\" made untrue in a way no test
    would catch. Recorded as a spec delta in § 10; ADR-0004 should say `body`
    must be newline-free, and amending it is not this item's."
  - "2026-10-06 — implementer — `receivedAt` comes from
    `ISchedulerProvider.BackgroundThread.Now`, so the one clock read the
    recorder needs is an injected one. It is deliberately **not**
    `IObservedClock`: that carries the provider's reported time, and ADR-0004
    § \"Consequences\" names confusing the two as the hazard the format's two
    timestamps create."
  - "2026-10-06 — implementer — the recordings root lives on this item's
    `RecordingOptions` rather than on `0012`'s `ReplayOptions`, which § 7 had
    declared it on. `adr/0001` item 2 requires a rehearsal to write and a
    replay to read the same place, and two types each carrying a root is two
    places for one answer. § 7 is amended, and `0012` reads the root from
    here."
  - "2026-10-06 — implementer — B-004 is proven through the fleet rather than
    at the envelope. The first test compared the envelope the transport
    returned and argued the fleet follows deterministically; the claim names
    the changesets reaching the fleet, and `test-from-scenarios`
    § \"A claim proven only against an inner method\" is explicit that an outer
    boundary needs a test through it. The test now runs the real transport,
    client, cache and projection and compares what the fleet was told, with a
    count assertion so two empty lists cannot pass as equivalent."
  - "2026-10-06 — implementer — production now parses JSON itself, which chore
    `0029` anticipated: `IJson`'s own remarks name the replay recorder as the
    expected second boundary and say the interface moves out of the test
    project when one appears. It is not moved here — `0029` is the item for it,
    and the transport reads with `JsonSerializerOptions.Default`, which is
    exactly what `IJson` uses, so the two cannot disagree in the meantime."


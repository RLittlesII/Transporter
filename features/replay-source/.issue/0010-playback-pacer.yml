summary: |
  Reads an NDJSON recording and yields each payload in recorded order at the
  recorded inter-arrival spacing, looping at the end without completing,
  faulting, or emitting a changeset that empties the fleet at the loop boundary.
  A torn final line is discarded and the stream carries on, because a recording
  truncated mid-write is the normal result of stopping a rehearsal.

  It hands back the payload still raw, which is what keeps a recording replayable
  after a converter fix (B-014). Parsing belongs to whatever substitutes over it
  — 0011 for aircraft, 0013 for vessels.

  It is handed an **opened stream** and resolves no path of its own (B-027), so
  file access stays out of the component that owns the time base. That was the
  open question this item carried; the Feature's `adr/0001` answered it.

  Nothing blocks it: it needs no provider, no credential, no network and now no
  filesystem either, and it is testable against a synthetic fixture with an
  injected scheduler. It is also
  what both substitution points are built on, which is why it ranks highest of
  the replay items.

acceptance_criteria:
  - "B-007, B-008 — recorded spacing from the recorded instants, and the loop
    boundary. No fixed interval substituted; nothing completes or faults."
  - "B-011 — no network and no credential, which is what lets CI exercise the
    pipeline end to end (user need 5)."
  - "B-012 — a torn final line is discarded and the stream continues."
  - "B-014 — replayable after a converter fix with no re-recording, which is
    what the payload staying raw is for."
  - "B-027 — the negative half of recording selection: this item resolves
    nothing and opens nothing, and takes the stream it is given. Declared in
    `claims:` and previously asserted only as an exclusion."
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - "2026-10-04 — spec-author — the pacer yields raw payloads rather than parsed
    envelopes, so B-014 holds and so a push recording (0013) can use the same
    component. Rejected: parsing here, which would put a converter below the
    substitution point and give aircraft and vessels two different pacers."

out_of_scope:
  - "Transport controls (§ 5 row 5) — playback is forward and looping, and
    ADR-0004 buys no index to seek with."
  - "Naming, resolving and reporting on a recording — B-024 – B-026 on 0012.
    B-027 is this item's negative half: resolve nothing, open nothing."
  - "Parsing a payload, and the instant and staleness that follow (B-009,
    B-010, B-013) — 0011."

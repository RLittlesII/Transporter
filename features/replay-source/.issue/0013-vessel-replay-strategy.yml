summary: |
  Vessel replay cannot mirror the aircraft half: a push provider has no contract
  to stand in for, so it substitutes at the strategy — an `ITrackerSource` fed by
  a recording — and reaches the seam the same way every other source does. The
  asymmetry is accepted and recorded in ADR-0002 § "Consequences"; what makes
  something a swap target is the seam it lands on, not the depth it substitutes
  at.

  One line per received message, in the same format and through the same
  selection path as an aircraft recording. Messages are never batched into
  poll-shaped snapshots to make a push feed resemble a polled one.

  The vessel-source items `0097` – `0102` now supply the message reader, reported
  time, client, vessel projection and tracker seam. This item records their live
  messages and replays them through a separate strategy and cache.

acceptance_criteria:
  - "B-023 — vessel replay substitutes at the strategy, not at a contract."
  - "B-019 — the aircraft recording's format and selection path, one line per
    received message, with no batching into poll-shaped snapshots."
  - "B-021 — no vehicle, record or snapshot type of its own."
  - "B-020 — a recorded fallback exists before the closing act is presented."
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - "2026-10-21 — implementer — preserve the push feed's one-message-per-frame recording. Reuse the live vessel message reader, snapshot merge, projection and tracker source. A replay-specific cache and pacer belong behind the strategy, not in a second vehicle or snapshot model."
  - "2026-10-21 — implementer — reset replay's provider-time maximum and each contact's first timed value only when the pacer genuinely rewinds. Keep the cache at that boundary so the fleet does not disappear; untimed messages retain the prior reported instant."
  - "2026-10-21 — implementer — inspect named vessel recordings against AisStream:SilentAfter, default ten minutes, while aircraft retain their five-minute minimum. Real stage configuration is checked after integration with the captured recording."
  - "2026-10-16 — spec-author — `ready-for-architecture` rather than `blocked`. Its blocker, the vessel feed's unwritten specification, is `src/Transporter/Integrations/AisStream/.spec/README.md`, and items `0096` – `0102` are cut from it. `depends_on` now names the three it needs: `0098` for the message shape, `0100` for the vessel, and `0102` for the seam it reaches the same way. B-021 has something to reproduce."
  - "2026-10-04 — spec-author — value 3 against the parent's 4, the only child
    scored below it. README presents the closing act as optional, while
    run-the-demo § \"Never add\" forbids presenting it without a fallback and
    B-020 claims that. The claim is conditional on the act happening, so the
    honest reading is a named user need met (3) rather than a stated goal
    degraded (4)."
  - "2026-10-15 — spec-author — the blocker moved from an unwritten
    specification to unbuilt items: the person chose ships for the closing act,
    and src/Transporter/Integrations/AisStream/.spec/README.md was written as a draft. Status
    stays blocked; nothing was re-scored, because the vessel items do not exist
    yet."


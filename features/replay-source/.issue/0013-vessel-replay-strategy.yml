summary: |
  Vessel replay cannot mirror the aircraft half: a push provider has no contract
  to stand in for, so it substitutes at the strategy — an `ITrackerSource` fed by
  a recording — and reaches the seam the same way every other source does. The
  asymmetry is accepted and recorded in ADR-0002 § "Consequences"; what makes
  something a swap target is the seam it lands on, not the depth it substitutes
  at.

  One line per received message, in the same format and through the same
  selection path as an aircraft recording. Messages are never batched into
  poll-shaped snapshots to make a push feed resemble a polled one.

  **`status: blocked`, and the blocker has no item to name.** Its prerequisite is
  an unwritten specification, not an unfiled task: replay spec § 5 row 2 defers
  the vessel feed, and aircraft-source § 5 row 3 leaves `Vessel`, the AISStream
  client, its cache and its tracker source unspecified. B-021 says replay
  introduces no type of its own and reproduces whatever the recorded provider's
  Feature defines — so there is nothing yet for it to reproduce. The claims can
  be designed; they cannot be built. `depends_on` names only 0010, because an
  unwritten Feature has no id.

  Unblocks when the vessel Feature has a specification. Re-score then: risk 4 is
  mostly the unspecified subject, not the work.

acceptance_criteria:
  - "B-023 — vessel replay substitutes at the strategy, not at a contract."
  - "B-019 — the aircraft recording's format and selection path, one line per
    received message, with no batching into poll-shaped snapshots."
  - "B-021 — no vehicle, record or snapshot type of its own."
  - "B-020 — a recorded fallback exists before the closing act is presented."
  - "§ 9 carries a row naming a test for each id above."

decisions:
  - "2026-10-04 — spec-author — value 3 against the parent's 4, the only child
    scored below it. README presents the closing act as optional, while
    run-the-demo § \"Never add\" forbids presenting it without a fallback and
    B-020 claims that. The claim is conditional on the act happening, so the
    honest reading is a named user need met (3) rather than a stated goal
    degraded (4)."


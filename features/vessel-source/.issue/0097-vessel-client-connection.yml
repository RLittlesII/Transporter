summary: |
  The vessel client's socket: one `ClientWebSocket` (ADR-0017) to the
  stream, compressed, subscribed in its first frame to the aircraft's own box
  with position reports and static data only, open only while the vessel
  strategy is live, reopened when the service drops it, and never more than
  one. The API key comes from the user-secrets store and nowhere else, and its
  absence is a reported failure.

  **`blocked` on § 11 row 6**, which § 11 times as "before the vessel
  client's item starts": which reported instant is a message's time is read
  from a captured message, and capturing one needs the person's AISStream key
  in the user-secrets store. Unblocks when row 6 is answered.

acceptance_criteria:
  - "B-001, B-002, B-007, B-011 — one box, read from the aircraft's setting, subscribed in the first frame, compressed, two message types."
  - "B-003, B-004 — the key from user secrets only; an absent key opens nothing and is reported."
  - "B-005, B-006 — at most one connection, open only while live, reopened without a rebuild."
  - "§ 9 carries a row naming a test or a performed review for each id above."


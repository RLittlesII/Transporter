summary: |
  As a line-of-business .NET developer in the talk audience I want to see the
  single point where a request/response feed becomes a reactive collection, and
  to find one name per layer when I read the repository afterwards, so that I
  can apply the pattern to my own REST-backed app without reverse-engineering
  which component holds which type.

  This is the parent of the whole aircraft path: a typed API contract that
  mirrors what OpenSky publishes, a client that reads the positional rows and
  diffs them into its cache, a per-type strategy that is the only place a domain
  object is built, a decorator that swaps strategies at runtime, and
  `IFleetTracker` wrapping that seam. Its six children slice it one layer at a
  time; it holds no work of its own.

acceptance_criteria:
  - "All 51 claims in § 3 of the spec — the children carry them in slices, and
    no claim is delivered twice. Which child takes which claims is each
    child's own `claims:` list, indexed in the specification's `## Tasks`."
  - "§ 9 Traceability Matrix has no Missing row once every child is done — that
    is the ship gate, not a green build (§ 4 row 13)."

decisions:
  - "2026-10-04 — spec-author — the layering is cut into six children, one per
    component boundary, rather than one item per claim group. Rejected: a
    single item for all 51 claims, which no review could judge against a diff."
  - "2026-10-04 — spec-author — the three layer-boundary claims (B-045 – B-047)
    are assigned to the child that makes each falsifiable rather than to a
    seventh item of their own: B-045 to 0004, B-046 to 0005, B-047 to 0007. A
    boundary cannot be asserted before both sides of it exist."

out_of_scope:
  - "Everything in § 5 of the spec — in particular the pipeline operators
    themselves (row 1), the vessel feed (row 3), the replay and simulated
    strategies (row 4), the swap control and stage choreography (row 5), and
    all UI (row 7)."
  - "Writing §§ 6-7 of the spec. That is the implementer's, and it is what the
    children's ready-for-architecture status is waiting on."

summary: |
  The item that answers the original complaint. `ITrackerSource` declares the
  `TransportVehicle` changeset stream, and the aircraft strategy behind it owns
  the Mapperly projection from snapshot to `Aircraft` — the first and only place
  a domain object is built. Projection is what genuinely varies between an
  aircraft feed and a vessel feed, which is what makes it the strategy and puts
  the seam at the domain boundary rather than the wire one.

  Declares the interface three later items plug into — two in this Feature and
  aircraft replay in the replay Feature — so it unblocks the most and ranks
  highest of either set. It still runs after 0004, which produces the snapshot
  changesets it projects.

acceptance_criteria:
  - "B-033 — the seam's declaration."
  - "B-034 — the projection this item owns. The first place a domain object
    exists."
  - "B-035, B-036 — canonical units, and absent values that are not zeroes.
    The item's hazard: a mapper will answer wrongly without complaining."
  - "B-037 — the key's form, and not widening the per-type interface."
  - "B-046 — the snapshot's referents. The snapshot dies at this projection,
    which is why the claim is verifiable here and not before."
  - "B-049 — the contract layer is conditional (§ 4 row 4), proved by a review
    this item completes rather than by a test. Two of its three clauses already
    hold and `0002`'s review said so: one contract layer, over the one
    request/response provider, and no contract invented for a socket because no
    push provider exists. The third — that the surface every strategy shares is
    `ITrackerSource` and nothing above it — has no subject until this item
    declares it, which is why the row is here. Re-done by the Feature that adds
    a push provider."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."

decisions:
  - "2026-10-05 — the person — B-049 moves here from `0002`. Its § 9 row is a
    review, and two of the three clauses were reviewable on `0002` and hold; the
    third names the `ITrackerSource` this item declares, so no change before
    this one can finish the row. Same shape as B-003 moving to `0004`: the claim
    goes to the item that builds its subject. § 3's sentence is unchanged and
    the row stays `Missing` until this item closes it."


summary: |
  The headline mechanism and the largest item: `AircraftSnapshotClient` takes
  the contract and the cache by constructor, reads every field of an 18-element
  row by positional index, and applies each fetched set to its cache as one
  differential update. That differential write is the step the talk exists to
  show, and after this item it has an address in the source.

  Carries the provider's awkward facts too: token refresh on expiry *and* on
  `401`, `429` treated as data and deferred by exactly the header's seconds,
  `X-Rate-Limit-Remaining` logged at debug, and a startup failure naming an
  absent credential. A failed poll must not terminate the stream.

  Needs the contract (0002) to call and the cache (0003) to write to, so it
  runs after both — they touch the same seam and must not run side by side.
  The recording tap (0009) taps this client, which is why this item unblocks
  two.

acceptance_criteria:
  - "B-003 — each fetched envelope's reported time is written to
    `IObservedClockWriter` in the same method that writes the cache, per
    ADR-0007. Both clauses ride the one test § 9 names: the second — that no
    consumer reads an ambient clock for an instant — has no analyzer rule,
    because ADR-0006 assigned none, so the test has to leave the client with no
    other source of one."
  - "B-015 — contract and cache by constructor."
  - "B-016 — positional reading, per README.md § \"Response shape\"."
  - "B-017, B-018 — absent versus defaulted, and absent versus present-zero.
    These two are the item's hazard: each wrong answer is plausible data."
  - "B-019, B-020, B-021 — callsign padding, squawk as a string, `sensors`."
  - "B-022 — one unreadable row does not abort the batch."
  - "B-023 — the whole-set differential update and the changeset stream. This
    is the claim the demo's core idea rests on."
  - "B-024 — box and interval as constructor or options input."
  - "B-025 — `extended=1` and the absent category."
  - "B-026, B-027, B-028 — token refresh and retry, the credit header at debug,
    and `429` as data. § 11 row 2 placed these on the HTTP transport, so this
    item finishes `OpenSkyHttpApi` rather than putting them on the client: the
    token source and the logger § 7 declares it taking arrive here. The
    deferral half of B-028 is the client's, and the ban on an exception is
    scoped to a subscriber of its stream."
  - "B-029 — startup on an absent credential, and a failed poll that neither
    completes nor error-terminates the stream."
  - "B-045 — the envelope's referents. Falsifiable here for the first time,
    because this is the second and last one."
  - "B-050 — the configurable interval and box (decisions/0001)."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."

decisions:
  - "2026-10-05 — spec-author — § 11 row 2 is answered, so this item moves from
    `ready-for-architecture` to `ready-for-implementation`. B-026 and B-027 name
    the HTTP transport and B-028 names both it and the client; the claim ids,
    this item's claim list and § Tasks are unchanged, because a claim's subject
    is which component satisfies it rather than which item builds it. Recorded
    as lessons/0001. The residual is § 11 row 4, which says of itself that it
    blocks nothing and targets the first test this item writes above the
    contract: if a substitute may not stand in at that seam, the double stays
    the hand-written fake B-010 already requires."
  - "**Answered 2026-10-05 by the decision below.** 2026-10-05 — spec-author —
    B-003's test is `AircraftSnapshotClientTests`'s and its behaviour is § 7's
    `IObservedClockWriter` call inside the method that writes the cache, but the
    claim is `0002`'s and `0002` has shipped without a client. No item can
    currently make that row pass. Raised rather than fixed: whether B-003 joins
    this item's claims is the person's."
  - "2026-10-05 — the person — B-003 is this item's. It gains the claim and an
    acceptance criterion; `0002` loses both and records the move. § 9's row is
    unchanged, because it already named the test and the class this item
    creates — the row was right and the claim list was wrong. Nothing else
    moves: a claim's owning item is which item builds it, and the subject of
    B-003's sentence is the envelope `0002` declares, so § 3 stands as written.
    ADR-0007 is the mechanism, and § 6 row 3 no longer reads `Unresolved`
    against it — it had kept that word, and a cite to a § 7 heading that no
    longer exists, since before the ADR was written."



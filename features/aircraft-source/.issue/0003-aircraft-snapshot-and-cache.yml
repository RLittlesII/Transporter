summary: |
  The snapshot — the server's record with names on it, value-equal over every
  member so the differ emits nothing for an unchanged aircraft — and the plain
  keyed store it lives in. The cache has no diff policy, no projection and no
  clock: the writer owns the write, which is what lets a push client add and
  remove directly instead of assembling a full set.

  Adds `DynamicData` to `Directory.Packages.props` — the first item that builds
  a cache does, per § 4 row 17.

  The highest-ranked startable item: nothing blocks it, and 0004 waits on it.

acceptance_criteria:
  - "B-011, B-012 — the snapshot's value equality and its key."
  - "B-013, B-014 — what the snapshot carries, and what it may not."
  - "B-030, B-031 — the cache's shape and its lifetime."
  - "B-032 — no domain type in the cache."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."

decisions:
  - "2026-10-04 — spec-author — the snapshot and its cache are one item rather
    than two. The cache's whole specification is three negative claims, and a
    store with nothing to store cannot be reviewed against a diff."


summary: |
  The bottom two layers: the envelope that mirrors what OpenSky sends, and the
  typed contract over it. One method per endpoint, `Task<T>`, `CancellationToken`
  last, implemented exactly once by an `internal sealed` class with explicit
  interface implementation. The envelope keeps the provider's positional
  `states` rows untouched — reading them is 0004's job, not this item's.

  Also delivers the hand-written contract fake, which is what lets every layer
  above be tested with no HTTP at all (§ 4 row 15).

  Starts with 0003 as the other root of the tree; nothing blocks it.

acceptance_criteria:
  - "B-001, B-002 — the envelope and its positional `states`."
  - "B-003 — the reported time as the observed instant."
  - "B-004 — the positional row type's visibility."
  - "B-005, B-006 — the contract's shape and what it may not name."
  - "B-007, B-008 — one concretion per transport, and the aliasing. This item
    builds the HTTP one; the recording one is the replay Feature's (§ 4 row 20)."
  - "B-009 — a new provider version is a new interface."
  - "B-010 — the hand-written fake, for this double only (§ 4 row 18)."
  - "B-048 — no version suffix yet (§ 4 row 3)."
  - "B-049 — the contract layer is conditional (§ 4 row 4)."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."

decisions:
  - "2026-10-04 — user — the contract takes one implementation per transport, so
    replay substitutes at the contract with this item's client, cache and
    projection unchanged above it. Rejected: replay as a strategy with its own
    client, which needed B-045 widened and left a second positional row reader
    and a second place B-003 had to be honoured. Recorded in ADR-0002 and as
    § 4 row 20; B-007 and B-008 amended. This item still builds only the HTTP
    implementation."
  - "**Superseded 2026-10-04 by the two decisions below.** 2026-10-04 —
    implementer — the HTTP transport inspects a `429` and returns
    `Left(OpenSkyThrottled)` rather than throwing, even though B-028 is
    `0004`'s claim. § 7's poll diagram puts the inspection in the transport and
    § Scoring moved the thrown-`429` hazard onto this item, so the alternative
    was shipping the recorded hazard. The deferral half — what the client does
    with the `Left` — is still `0004`'s and still waits on § 11 question 2, so
    B-028's § 9 row stays `Missing`."
  - "2026-10-04 — implementer — `OpenSkyHttpApi` takes only `IFlurlClientCache`.
    § 7 declares it with a token source and a logger beside that; both serve
    B-026 and B-027, which this item's `out_of_scope` routes to `0004` and
    which § 11 question 2 has not yet placed on a component. Rejected:
    declaring `IOpenSkyTokenSource` now with nothing behind it, which is a seam
    with no second implementation and no caller."
  - "2026-10-04 — implementer — the positional row's converter is attached with
    `[JsonConverter]` on `OpenSkyStateRow` rather than registered in the named
    client's `JsonSerializerOptions`. The wiring stays with the type that needs
    it, and a committed fixture deserializes without standing up the HTTP
    stack. Rejected: the serializer-options route `flurl-http-client` shows,
    which leaves the envelope unreadable outside a configured client."
  - "2026-10-04 — implementer — `AddOpenSky` extends `IServiceCollection`, not
    `MauiAppBuilder`, so B-008 is provable in a unit test with no MAUI host.
    The `src/Gui` builder block calls it when the chain is assembled, which is
    `0004` and later."
  - "2026-10-04 — the person — an API contract is the I/O boundary and is
    allowed to throw; the Failure/Result track starts once a value is back
    inside the application. So `GetStates` returns `OpenSkyStatesResponse` and
    a `429` becomes `OpenSkyThrottledException`, read off the Flurl response
    first so the retry-after seconds survive. Recorded repository-wide in
    ADR-0008. Rejected: letting `FlurlHttpException` carry it, which writes the
    caller against the transport library; a discriminated union of the two
    outcomes, which leaves the caller two mechanisms because the other failures
    stay exceptions; and keeping the `Either`, whose `Left` held the one
    outcome that was not a failure while the failures went past it."
  - "2026-10-04 — the person — B-028's \"SHALL NOT surface as an exception\"
    names no *where*, while its scenario bans one only at the subscriber. That
    wording folds into § 11 question 2, which is already queued for
    `spec-author` over the same claim, rather than opening a question of its
    own. This item is therefore not blocked; B-028's § 9 row stays `Missing`."
  - "2026-10-04 — the person — review of pull request #1 rejected the three
    reflection tests. B-002, B-005 and B-010's mocking-framework clause move
    to the analyzer under ADR-0006, which had already said a claim about
    structure is a diagnostic rather than a test. `Verified` drops from five
    rows to two. Rejected: keeping the behavioural half of each claim green,
    which § 9 cannot express because a row carries one status; and marking
    them Review, which ADR-0006 reserves for claims constraining code the
    repository does not contain. Recorded as lesson 0006."
  - "2026-10-04 — the person — the system under test is built by a generated
    `Rocket.Surgery.Extensions.Testing.AutoFixtures` fixture rather than by a
    constructor call, so `OpenSkyHttpApi` and `OpenSkyApiFake` each get one.
    `OpenSkyApiFake` takes its response by constructor to give the generator a
    `With` method, and the generator's `default` for that parameter is what
    leaves the unset case throwing. B-010 is unchanged: the fake stays
    hand-written. Rejected: a substitute in its place, which returns `default`
    on an unset call — the hazard § Scoring recorded against this item — and
    which B-010 forbids outright."


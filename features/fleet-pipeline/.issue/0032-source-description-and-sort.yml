summary: |
  The source description is what replaces the downcast ADR-0005 item 6 forbids:
  a column is a display name plus a selector over the abstract vehicle, a
  comparer comes from the description rather than from a view, and the grouping
  keys a source offers are its own. Sorting is claimed here with them, because
  a comparer and a grouping key are the same mechanism read two ways.

  `TransportVehicle` gains the `abstract` grouping key ADR-0005 item 2 requires
  and `Aircraft` answers it with its origin country (B-013).

  Runs before `0033`: the grouping that item applies is chosen from the
  description this one introduces.

acceptance_criteria:
  - "B-009 — a new comparer reorders in place; nothing is cleared or refilled."
  - "B-010 — every comparer reads base members only."
  - "B-011 — ties break on the key, so two sorts of an unchanged fleet agree."
  - "B-013 — the grouping answer is `abstract` on the base; `Aircraft` answers
    with its origin country. A source that answers none does not compile."
  - "B-020 — the description names the columns, comparers and groupings."
  - "B-021 — a swap swaps the description and edits no stage, comparer,
    predicate or key."
  - "B-022 — no cast, type test or switch on a concrete vehicle. Analyzer rule."
  - "§ 9 Traceability Matrix carries a row naming a test for each id above."


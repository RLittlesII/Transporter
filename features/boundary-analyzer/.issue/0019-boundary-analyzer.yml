summary: |
  As the person deciding what ships I want the eighteen structural claims
  aircraft-source § 9 leaves Missing to be enforced by the compiler, and as a
  developer reading this repository afterwards I want to see the layering held
  by the same build that compiles it, so that a boundary is a build error for
  everyone rather than an agreement the author remembers.

  Parent of the analyzer: the project the compiler loads, the diagnostic
  conventions every rule obeys, and the three rule families § 7's mapping table
  groups — reference rules over method bodies, declaration rules, and call-site
  rules. Five children; it holds no work of its own.

  Claim ids here resolve against features/boundary-analyzer/.spec/README.md.
  The eighteen claims the analyzer enforces belong to
  features/aircraft-source/.spec/README.md and are NOT listed in any
  `claims:` in this Feature — that specification's § 9 owns their coverage, and
  B-019 forbids the second store.

acceptance_criteria:
  - "All 19 claims in § 3, carried once each. Which child takes which is each
    child's own `claims:` list, indexed in the specification's `## Tasks`."
  - "§ 9 has no Missing row once every child is done."
  - "The eighteen rows in aircraft-source § 9 that name BoundaryAnalyzerTests
    stop reading Missing — the outcome this Feature exists for, recorded there
    and not here."

decisions:
  - "2026-10-04 — the person — the analyzer is built, and this specification is
    written before any of it. The 'by whom' half of aircraft-source § 11 row 3;
    the 'when' half stays open there and as § 11 row 4 here."
  - "2026-10-04 — the person — diagnostics carry the TRN prefix. The numbering
    that followed is features/boundary-analyzer/.spec/adr/0001: TRN ids run on
    their own sequence and encode no claim number, because a claim id is only
    unique inside one specification."
  - "2026-10-04 — spec-author — cut into five children on what a rule has to
    look at rather than on § 3's four claim groups. A reference rule, a
    declaration rule and a call-site rule are three different registrations
    against the same compilation; the claim groups would have split the
    conventions away from the first rule that needs them."

out_of_scope:
  - "Everything in § 5 of the specification."
  - "aircraft-source B-009 and B-049 — § 5 row 1; review obligations on the
    Feature that creates each precondition."
  - "A code fix for any diagnostic — § 5 row 2."
  - "Any replay-source claim — § 5 row 3, and § 11 row 3 carries the question."
